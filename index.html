—divided, for better support, by six partitions where the excavators labor—the men pass, grave and silent at their entrance, cold, anxious, white, and lugubrious as ghosts at their exit, through a kind of antechamber, or air-lock, with two doors, one to the upper shaft, the other to the cave, which never open at once, lest the compressed air escape: only the cave's door opens to give entry to the brave army when that of the shaft has already closed behind them, or the shaft's door, to give them exit, when they have already left the cave's door shut. Behold how, through four great openings, there descend to the bottom of the excavation the clanging dredges, with their concave jaws, to seek at the bottom of the shafts—dug to a depth greater than the water level, for which reason the water rises in them to its level—the mud, the sand, the pieces of rock, which in ceaseless shovelfuls the excavators cast into the shafts, so that afterward, as the famished dredge locks its open jaws into the deep opening with a rattle of chains, it may swallow them, suddenly closing its powerful jaws, and draw them up—caisson and tower upward—into the open air, and empty them into the cleaning barges! Behold how, as those heroic, feverish laborers—in whose swollen brains the rushing blood gathers—clean the base, they alternately remove the palisades they had placed a little before beneath the partitions of the strange fabric, and, with this system of steps, let fall upon the palisades that remain the tower, which, without the support of those they take away, bears down more heavily upon the rest, and sinks—and replace upon the newly cleaned ground those they removed, so as at once to take away those they had left before, on separating which the tower sinks once more upon the new ones. Behold how, the water expelled and the rock now laid bare, the men cast between it and the top of the caisson 8,000 tons of hydraulic cement—a mass which man, jealous of the nature that created hard crags, has invented. Thus, always at water level, upon the caisson that with its entrails of men went sinking, they built the tower that with its burden of granite went rising. And then, with powerful cranes, they raised to 300 feet the stones, great as houses, that crown the tower. And the masons set in place, at that height—as children set their wooden blocks in a toy Crandall tower—stones at whose slightest shock, like butterfly wings at a human blow, the bodies of the workers were dashed to pieces, or their skulls laid open. Oh, unknown workers, oh beautiful martyrs, entrails of greatness, foundation of the eternal fabric, worms of glory!\n\nAnd the cables, the sated boas? What spider wove this web from bank to bank over the void? What messenger carried 20,000 times, from the pins of the Brooklyn anchorage, the 19 skeins of which each wire is made, and the 278 strands of which each skein is made, to the pins of the New York anchorage? One morning, like a gallant courting his lady, a steamship circled at the foot of the Brooklyn tower: up it goes, slowly hoisted, the first cord! They mount it upon the tower; they fasten it to the anchoring structure; the steamship drags it to the foot of the New York tower; they hoist the other end; they pass it over the other tower; they fix it to the other anchorage; in the same way they pass a second cord; they join, in each anchorage, around pulleys moved by steam, the ends of both cords—and now the glorious \"traveling cord\" is left in perpetual circular motion. Seated in a swing hung from a pulley fixed to the cord that the steam engine sets in motion, the first to cross—amid the booming of cannon, the whistling of locomotives, the waving of flags, and the hurrahs of hundreds of thousands of men—is fearless Farrington, chief of the mechanics. Then they mount upon the traveling cord, raised in arms of iron, a grooved wooden wheel, in which they fit the wire—well soaked in linseed oil to prevent rust, and afterward well dried—which, on eight great wheels, two at the foot of each cable, they have wound, for an extent of two miles, equal to 52 coils around each wheel: there goes the pulley, toiling ant, from one end of the bridge to the other, with its double thread of wire! It arrives, they caress it, they unfit the thread and refit it around a great iron horseshoe of fluted edge—the provisional mold from which they later draw the cable to set it into the last pin of the chain: back goes the pulley, empty, creaking and clattering, to the other end: they adjust—with very great labor, from the anchorages and the tops of the towers—the diverse length that each thread must have, since each lies at a diverse height within the skein: there goes the pulley again; the round needle that has sewn the cable! there it goes 139 times, in which it leaves 278 threads! And now the skein is made, which they sheathe in wire, like the eighteen more they make, all at one time, for each of the four cables: and now made, they clamp them with great bands; they tighten still further the nineteen skeins, in which the threads lie one beside another, not braided; they gird the cable with half-cylinders, well pressed together; and upon a kind of moving raft that hangs from the cable itself there go—weavers of the air—the sheathers, wrapping the circular mass with wire, which a simple machine, like a steering wheel, carrying the wire wound upon a spool, lets out in a spiral: and now, the boa well dressed, they lay it upon its grooved plate which, upon sliding wheels—so that the cable may stretch and shrink, and not harm the fabric with its weight—awaits it on the summit of the tower.\n\nFrom the cables hang, held by iron bands, the braided stays, 208 on each cable: from the stays, the horizontal plates that sustain the pavement, and the six vertical walls of diverse heights that cross them, and steel laths from wall to wall, and diagonal laths, upon whose framework there spread, in a thick tongue 3,178 feet long and 85 wide, the five roadways—19 feet wide the carriage ones; the railway ones, 15½—and, giving a view of islands like baskets, of cities like furnaces, of steamships that seem, for how alert, noisy, and skillful they are, talking messengers, and white ants that jostle one another on the river, cross their antennae, communicate their message, and part—giving a view of rivers like seas, there rises in the center, like a crest 16 feet wide, the path of the people on foot who, since the bridge opened its doors, cross it—at times pressing together in enormous masses, to give exit to which one must raise the railings of the path—two formidable and never-thinning files of pedestrians.\n\nNor is there fear that the structure will come down, for even were the 278 [strands] that sustain it from each cable to break all at once, there would suffice to hold it aloft, with its own weight and that of the traffic, the branching of auxiliary stays which, like a tremendous open hand of slender wrist, comes down almost to the middle of the cable on each side, from the top of each tower. There is no fear that the structure will move, nor that it will be shaken by the play of the winds or the wraths of the storm; because at its base the towers bite it with teeth of steel, and so that the greatest wind may not disturb it, the two outer cables curve inward as they reach the middle of the bridge, and the two inner ones bend toward the outer ones, whereby the resistance is made greater. The mischievous winds will not, no, come to overturn carts into the river, because the edges of the bridge rise 8 feet high, and between the carriage roadways and those of the railway there is strung, to restrain the thrusts of the wind, a net of strong wires. Nor is there risk that the cables will give way—for there will never come upon each of them a weight greater than 3,000 tons, and it is made to sustain, with its 294 arms, twelve thousand. Nor will the bridge twist, splinter, or spring apart when the heat of summer dilates it—as the spirit dilates in the sun of love—or the rigor of winter shortens it; because this fivefold roadway is, as it were, split into two halves, to prevent the expansion and the contraction, by means of an extension plate at the midpoint of the way, which plate, fixed to the end of one of the portions, joins upon movable couplings with the end of the second portion. And when, at the foot of one of the towers, there pile up in a blockade with no way out thousands of women who sob, children who cry, policemen who shout, struggling to open a path, there move seigniorially, like giants who bow in greeting, a mere hair's breadth, the cables in their sliding beds atop the towers. Thus have they built, and thus it remains, less beautiful than great, and like the powerful arm of the human mind, the mighty structure. No longer are deep moats dug around battlemented fortresses; rather, with arms of steel, cities embrace one another; no longer do sentry boxes of soldiers guard the towns, but booths of clerks with neither lance nor rifle, who collect the penny of peace from the labor that passes by: bridges are the fortresses of the modern world. Better than to open breasts is to join cities: this is what all men are now called to be—soldiers of the bridge!"}, {"t": "Itinerant Teachers", "b": "José Martí — La América, New York, 1884", "x": "New York, May 1884\n\n\"But how would you establish that system of itinerant teachers which we have never seen mentioned in any book on education, and which you recommend in one of the issues of La América from last year that I have before me?\" —So an enthusiastic gentleman from Santo Domingo is good enough to ask us.\n\nWe will tell him, in brief, that what matters is the thing itself, and not the form in which it is done.\n\nThere is a cluster of essential truths that could fit within the wing of a hummingbird, and yet they are the key to public peace, to spiritual elevation, and to the greatness of nations.\n\nMen must be kept in knowledge of the earth and of the permanence and transcendence of life.\n\nMen must live in the peaceful, natural, and inevitable enjoyment of Liberty, as they live in the enjoyment of air and of light.\n\nA people is condemned to die in which the love of wealth and the knowledge of the sweetness, the necessity, and the pleasures of life do not develop in equal measure.\n\nMen need to know the composition, the fertilization, the transformations, and the applications of the material elements, from whose working comes the wholesome pride of one who labors directly in nature, the vigor of body that results from contact with the forces of the earth, and the honest and secure fortune that its cultivation produces.\n\nMen need someone who often stirs compassion in their breast, and tears in their eyes, and does them the supreme good of making them feel generous; for by a marvelous compensation of nature, he who gives himself grows; while he who withdraws into himself, and lives on small pleasures, and fears to share them with others, and thinks only, avariciously, of serving his own appetites, is gradually transformed from a man into a solitude, and carries in his breast all the white hairs of winter, and comes to be within, and to appear without—an insect.\n\nMen grow, grow physically, grow in a visible way, when they learn something, when they come to possess something, and when they have done some good.\n\nOnly fools speak of misfortunes, or the selfish. Happiness exists upon the earth; and it is won through the prudent exercise of reason, the knowledge of the harmony of the universe, and the constant practice of generosity. He who seeks it elsewhere will not find it: for after having tasted every cup of life, flavor is found only in these. —It is a legend in the lands of Spanish America that at the bottom of the old cups a Christ was painted, which is why, when someone drains one, they say: \"Until I see you, my Christ!\" Well, at the bottom of those cups there opens a serene, fragrant, endless sky, overflowing with tenderness!\n\nTo be good is the only way to be happy.\n\nTo be cultured is the only way to be free.\n\nBut, in the common run of human nature, one must be prosperous in order to be good.\n\nAnd the only road open to constant and easy prosperity is that of knowing, cultivating, and making use of the inexhaustible and tireless elements of nature. Nature has no jealousies, as men have. It has no hatreds, nor fear, as men have. It bars the way to no one, because it fears no one. Men will always have need of the products of nature. And since in each region only certain products are given, their active exchange will always be maintained, which assures all peoples comfort and wealth.\n\nThere is no need, then, to undertake now a crusade to reconquer the Holy Sepulcher. Jesus did not die in Palestine, but rather is alive in every man. The greater part of mankind has passed asleep over the earth. They ate and drank; but they knew nothing of themselves. The crusade must be undertaken now to reveal to men their own nature, and to give them, with the knowledge of plain and practical science, the personal independence that strengthens goodness and fosters the decorum and the pride of being a loving creature and a living thing in the great universe.\n\nHere, then, is what the teachers must carry through the countryside. Not only agricultural explanations and mechanical instruments; but tenderness, which men so greatly need and which does them so much good.\n\nThe peasant cannot leave his work to go miles down the road to see incomprehensible geometric figures, and to learn the capes and rivers of the peninsulas of Africa, and to stock himself with empty didactic terms. The peasants' children cannot withdraw whole leagues, day after day, from their father's homestead to go and learn Latin declensions and abbreviated division. And the peasants, nevertheless, are the best mass of the nation, and the most healthy and vigorous, because they receive, closely and fully, the emanations and the kindly correspondence of the earth, in whose company they live. The cities are the mind of nations; but their heart, where the blood gathers and from which it is distributed, lies in the countryside. Men are still eating machines, and reliquaries of prejudices. It is necessary to make of each man a torch.\n\nWhy, nothing less do we propose than the new religion and the new priests! Nothing less do we go depicting than the missions with which the new age will soon begin to spread its religion! The world is in a state of change; and the purples and the chasubles, necessary in the mystical times of man, lie stretched upon the bed of agony. Religion has not disappeared, but rather has been transformed. Above the dismay into which the study of the details and the slow unfolding of human history plunges observers, one sees that men grow, and that they have already climbed half of Jacob's ladder: what beautiful poetry the Bible holds! If, crouched upon a summit, one suddenly casts one's eyes over the march of humanity, one will see that never did peoples love one another as much as they love one another now, and that in spite of the painful disorder and the abominable selfishness into which the momentary absence of final beliefs and faith in the truth of the Eternal brings the inhabitants of this transitory age, never were human beings as preoccupied as they are today with the benevolence and the impulse of expansion that now sets all men ablaze. They have risen to their feet, like friends who knew of one another, and longed to become acquainted; and they all march together toward a happy encounter.\n\nWe walk upon the waves, and we rebound and roll with them; and so we do not see, nor, stunned by the blow, do we pause to examine, the forces that move them. But when this sea grows calm, it may be affirmed that the stars will remain nearer to the earth. Man will at last sheathe in the sun his sword of battle!\n\nWhat has been said is what we would set as the soul of the itinerant teachers. What joy there would be among the peasants, when they saw arriving, from time to time, the good man who teaches them what they do not know, and who, with the effusions of an expansive manner, leaves in their spirit the calm and elevation that always remain from seeing a loving and healthy man! Instead of livestock and harvests, they would speak now and then—until at last they would be speaking always—of what the teacher taught, of the curious machine he brought, of the simple way to cultivate the plant they had been working with such labor, of how great and good the teacher is, and of when he will come, for they are already in a hurry to ask him about what, with that ceaseless enlargement of the mind once set to thinking, has been occurring to them ever since they began to know something! With what joy they would all go to take shelter, leaving behind their spades and hoes, in the teacher's field tent, full of curiosities!\n\nLong courses, it is clear, could not be given; but the germinal ideas could indeed, if well studied by the propagators, be scattered and infused. The appetite for knowledge could be awakened. The impetus could be given.\n\nAnd this would be a gentle invasion, made in accordance with what is base and self-interested in the human soul; because, since the teacher would be teaching them, in a mild manner, practical and profitable things, there would be instilled in them of their own pleasure, without effort, a knowledge that begins by flattering and serving their interest;—for whoever intends to better man must not disregard his evil passions, but rather count them as a most important factor, and contrive not to act against them, but with them.\n\nWe would not send pedagogues through the countryside, but conversers. We would not send schoolmasters, but educated people who would go about answering the doubts the ignorant presented to them, or the questions they had prepared for when the teachers came, and observing where errors of cultivation were being committed or exploitable riches went unrecognized, so as to reveal the latter and demonstrate the former, with the remedy at the foot of the demonstration.\n\nIn sum, there is a need to open a campaign of tenderness and of science, and to create for it a body—which does not exist—of missionary teachers.\n\nThe itinerant school is the only one that can remedy the ignorance of the countryside.\n\nAnd in the countryside as in the cities, there is an urgent need to replace the indirect and sterile knowledge of books with the direct and fruitful knowledge of nature.\n\nThere is an urgent need to open normal schools of practical teachers, so as to scatter them afterward through valleys, mountains, and corners, as the Indians of the Amazon tell that Father Amalivaca, in order to create men and women, scattered over all the earth the seeds of the moriche palm!\n\nTime is wasted in elementary literary instruction, and peoples of pernicious and empty aspirants are created. The sun is no more necessary than the establishment of elementary scientific instruction.\n\nLa América, New York, May 1884."}, {"t": "Letter to Manuel Mercado (unfinished)", "b": "José Martí — Dos Ríos camp, Cuba, May 18, 1895 — written the day before his death", "x": "Camp of Dos Ríos, May 18, 1895\n\nSeñor Manuel Mercado.\n\nMy dearest brother: At last I can write; at last I can tell you with what tenderness and gratitude and respect I love you, and that household which is mine, and my pride and my duty. Every day now I am in danger of giving my life for my country and for my duty—for I understand that duty and have the spirit to carry it out—the duty of preventing in time, through the independence of Cuba, the United States from spreading across the Antilles and falling, with that added force, upon our lands of America. All that I have done until today, and all that I shall do, is for this. It has had to be done in silence, and as it were indirectly, because there are things that, to be achieved, must go hidden, and that, if proclaimed for what they are, would raise difficulties too formidable to attain the end over them.\n\nThe very lesser and public obligations of nations—such as yours and mine—which are most vitally concerned in preventing the opening in Cuba, through the annexation of the imperialists over there and of the Spaniards, of the road which is to be blocked, and which we are blocking with our blood, of the annexation of the peoples of our America to the turbulent and brutal North that despises them—would have kept them from the open adherence and manifest aid to this sacrifice, which is made for their immediate benefit. I have lived inside the monster, and I know its entrails;—and my sling is the sling of David.\n\nAt this very moment, a few days ago, in the flush of the victory with which the Cubans greeted our free emergence from the mountains where the six men of the expedition had wandered for fourteen days, the correspondent of the Herald, who pulled me from my hammock in my hut, speaks to me of the annexationist activity—less to be feared for the slight reality of its aspirants, of the pettifogging sort, without backbone or creativity, who, as a comfortable disguise for their complaisance or their submission to Spain, beg of her, without faith, the autonomy of Cuba, content only that there be a master, Yankee or Spanish, to sustain them, or to create for them, in reward for their office of go-betweens, the standing of leading men, disdainful of the vigorous mass—the mestizo mass, skillful and moving, of the country—the intelligent and creative mass of whites and blacks.\n\nAnd the Herald correspondent, Eugenio Bryson, tells me more:—of a Yankee syndicate—which shall not be—with a lien upon the Customs, too deeply pledged to the rapacious Spanish banks for any handhold to remain for those of the North—fortunately incapacitated, by its hampered and complex political constitution, from undertaking or supporting the idea as a work of the government. And Bryson told me yet more—though the certainty of the conversation he reported to me can only be grasped by one who knows at close hand the vigor with which we have raised the revolution, the disorder, the listlessness and the bad pay of the novice Spanish army, and the incapacity of Spain to gather, in Cuba or abroad, the resources against the war which the previous time she drew from Cuba alone:—Bryson recounted his conversation with Martínez Campos, at the end of which the latter gave him to understand that, without doubt, when the hour came, Spain would rather come to terms with the United States than surrender the Island to the Cubans. And Bryson told me still more: of a man known to us, and of how much he is cultivated in the North as the candidate of the United States, for when the present president shall disappear, for the presidency of Mexico.\n\nHereabouts, I do my duty. The war of Cuba, a reality superior to the vague and scattered desires of the Cuban and Spanish annexationists to whom only their alliance with the government of Spain would give any relative power, has come in its hour in America, to prevent—even against the frank employment of all those forces—the annexation of Cuba to the United States, which will never accept it from a country at war, nor can contract, since the war will not accept annexation, the odious and absurd commitment of putting down on their own account and with their own arms a war of American independence.—And Mexico—will it not find a shrewd, effective and immediate way of aiding, in time, him who defends it? Yes, it will find one—or I shall find it for her. This is a matter of death or life, and there is no room for error. The discreet way is the only thing that remains to be seen. I would already have found and proposed it. But I must have more authority in myself, or know who holds it, before acting or advising. I have only just arrived. The constitution of our government, useful and simple, may yet take two months, if it is to be real and stable. Our soul is one, and I know it, and the will of the country; but these things are always the work of relation, of the moment, and of accommodations. With the representation that I hold, I do not wish to do anything that may seem a capricious extension of it.\n\nI arrived, with General Máximo Gómez and four others, in a boat, in which I took the bow oar under the storm, to an unknown rocky stretch of our shores; for fourteen days I carried on foot, over thorns and heights, my knapsack and my rifle;—we roused people as we passed; I feel, in the benevolence of souls, the root of this love of mine for the sorrow of man and for the justice of relieving it; the fields are ours without dispute, to such a degree that in one month I have been able to hear gunfire only once; and at the gates of the cities we either win a victory, or review, amid an enthusiasm like religious fire, three thousand armed men;—we continue our march to the center of the Island, so that I may lay down, before the revolution I have raised up, the authority the emigration gave me, which was heeded within, and which must be renewed, in keeping with its new condition, by an assembly of delegates of the visible Cuban people, of the revolutionaries in arms. The revolution desires full liberty in the army, without the shackles formerly set against it by a Chamber without real sanction, or by the suspicion of a youth jealous of its republicanism, or by the jealousy, and the fears of excessive future prominence, of a scrupulous or far-seeing chieftain; but the revolution wishes at the same time a succinct and respectable republican representation—the same soul of humanity and decorum, filled with the longing for individual dignity, in the representation of the republic, as the one that drives and sustains the revolutionaries in the war.\n\nFor my part, I understand that a people cannot be led against the soul that moves it, or without that soul, and I know how hearts are kindled, and how the fiery and contented state of hearts may be turned to account for the ceaseless stirring and the onset. But as to forms, many ideas have their place: and the affairs of men are made with the men who make them. You know me. In myself, I will defend only what I hold to be a guarantee or a service of the revolution. I know how to disappear. But my thought would not disappear, nor would my obscurity embitter me.—And as soon as we have form, we shall act, whether this falls to me, or to others.\n\nAnd now, having set before you what is of public interest, I will speak to you of myself, since only the emotion of this duty could raise from the longed-for death the man who—now that Nájera no longer lives where he may be seen—best knows you, and cherishes as a treasure in his heart the friendship with which you honor him. I know your scoldings, held in silence, after my journey. And how much of ourselves we gave, with all our soul, and he silent! What a deception this is, and what a hardened soul is his, that the tribute and the honor of our affection has not been able to make him write one more letter upon the letter-paper and the newspaper that he fills day by day![…]\n\nThere are effects of so delicate an honesty."}]</script>
<script type="application/json" id="passages">[{"e": 0, "t": "The vain villager believes that the whole world is his village, and so long as he can stay on as mayor, or torment the rival who stole his sweetheart, or watch his savings grow in their money box, he holds the order of the universe to be good, knowing nothing of the giants in seven-league boots who can set a boot upon him, nor of the battle of the comets in the Heavens, which go through the air, asleep, gulping down worlds. Whatever is left of the village in America must awaken. These are not times for lying down to sleep with a handkerchief about the head, but with weapons for a pillow, like the men of Juan de Castellanos: the weapons of the mind, which conquer all others. Trenches of ideas are worth more than trenches of stone."}, {"e": 0, "t": "There is no prow that can cut through a cloud of ideas. A vigorous idea, flashed in time before the world, can stop, like the mystical banner of the Last Judgment, a squadron of ironclads. Peoples that do not know one another must hasten to know one another, like men who are about to fight together. Those who shake their fists at each other, like jealous brothers coveting the same tract of land, or like the man in the small house who envies the man in the better one, must clasp their two hands together until they become one. Those who, under the shelter of a criminal tradition, lopped off, with the sword stained by the blood of their own veins, the land of the vanquished brother, the brother punished far beyond his faults, must give that brother back his lands, if they do not wish the people to call them"}, {"e": 0, "t": "thieves. The debts of honor the honorable man does not collect in money, so much per slap in the face. We can no longer be a people of leaves, living in the air, our crown heavy with bloom, crackling or humming at the caprice of the light's caress, or beaten and felled by the tempests: the trees must close ranks, so that the giant with the seven-league boots cannot pass! It is the hour of the muster and of the united march, and we must advance in close array, like silver in the roots of the Andes."}, {"e": 0, "t": "Only the seven-month runts will be found wanting in courage. Those who have no faith in their land are men born at seven months. Because they themselves lack courage, they deny it to others. The sickly arm, the arm with painted nails and a bracelet, the arm of Madrid or of Paris, cannot reach the lofty tree, and so they say the tree cannot be reached. The ships must be loaded with these harmful insects that gnaw at the bone of the homeland that nourishes them. If they are Parisians or Madrileños, let them stroll to the Prado, among the lamplights, or to Tortoni's, for a sherbet. These sons of a carpenter who are ashamed that their father is a carpenter! These men born in America who are ashamed of the mother who reared them, because she wears an Indian apron, and who disown, the scoundrels, their sick"}, {"e": 0, "t": "mother, and leave her alone on her bed of illness! Well then, which is the true man? He who stays with his mother to nurse her through her illness, or he who sets her to work out of sight and lives off her sustenance in rotten lands, with a worm for a necktie, cursing the bosom that bore him, parading on the back of his paper frock coat the placard of a traitor? These sons of our America, which must be saved through its Indians, and which is rising from less to more; these deserters who beg for a rifle in the armies of North America, which drowns its own Indians in blood, and which is sinking from more to less! These dainty creatures who are men and will not do the work of men! Did the Washington who made this land for them go off to live with the English, to live with the English in the very years when he"}, {"e": 0, "t": "saw them marching against his own country? These \"incredibles\" of honor, who drag it through foreign dirt, as the Incredibles of the French Revolution, dancing and smacking their lips, drew out their r's!"}, {"e": 0, "t": "And in what homeland can a man take greater pride than in our suffering republics of America, raised up among the mute masses of Indians, to the sound of battle between the book and the processional candle, upon the bloodied arms of a hundred apostles? Out of factors so disordered, never, in a shorter span of history, were nations so advanced and so compact ever created. The arrogant man believes that the earth was made to serve as his pedestal, because his pen runs easily or his words come in bright colors, and he accuses his native republic of being incapable and beyond remedy, because its young jungles do not grant him a steady means of going about the world as a celebrated grandee, driving Persian ponies and pouring out champagne. The incapacity lies not in the nascent country, which asks for forms that"}, {"e": 0, "t": "suit it and for a useful greatness, but in those who would govern original peoples, of singular and violent composition, with laws inherited from four centuries of free practice in the United States, from nineteen centuries of monarchy in France. A decree of Hamilton's will not halt the charge of the plainsman's colt. A phrase of Sieyès's will not set flowing again the clotted blood of the Indian race. To govern well, one must attend to what is, there where one governs; and the good governor in America is not the one who knows how the German or the Frenchman is governed, but the one who knows of what elements his own country is made, and how he can lead them all together, so as to arrive, by methods and institutions born from the country itself, at that desirable state in which every man knows himself and"}, {"e": 0, "t": "exerts himself, and all enjoy the abundance that Nature placed, for everyone, in the land they make fruitful with their labor and defend with their lives. The government must be born of the country. The spirit of the government must be that of the country. The form of the government must conform to the country's own constitution. The government is nothing more than the balance of the natural elements of the country."}, {"e": 0, "t": "That is why the imported book has been conquered in America by the natural man. The natural men have conquered the artificial men of letters. The native mestizo has conquered the exotic Creole. There is no battle between civilization and barbarism, but only between false erudition and nature. The natural man is good, and he respects and rewards a superior intelligence, so long as that intelligence does not use his submission to harm him, or offend him by passing him over—a thing the natural man does not forgive, ready as he is to recover by force the respect of whoever wounds his sensibility or injures his interest. It is by their accord with these scorned natural elements that the tyrants of America have climbed to power; and they have fallen the moment they betrayed them. The republics have purged, in"}, {"e": 0, "t": "their tyrannies, their incapacity to know the true elements of the country, to derive from them the form of government, and to govern by means of them. To govern, in a new people, means to create."}, {"e": 0, "t": "In peoples made up of cultured and uncultured elements, the uncultured will govern, by their habit of attacking and of settling doubts with their own hand, wherever the cultured do not learn the art of government. The uncultured mass is lazy, and timid in matters of the intelligence, and wants to be well governed; but if the government injures it, it shakes it off and governs itself. How are governors to come out of the universities, when there is no university in America that teaches the rudiments of the art of government, which is the analysis of the elements peculiar to the peoples of America? Young men go out into the world to make their guesses, with Yankee or French spectacles, and aspire to direct a people they do not know. In the race of politics, entry should be denied to those who do not know the"}, {"e": 0, "t": "rudiments of politics. The prize in the competitions should go not to the best ode, but to the best study of the factors of the country in which one lives. In the newspaper, in the lecture hall, in the academy, the study of the country's real factors must be carried forward. To know them is enough, without blindfolds and without evasions; for whoever sets aside, by will or by forgetfulness, a part of the truth, falls in the long run through the very truth he lacked, which grows in the negligence and brings down whatever is raised without it. To solve the problem after knowing its elements is easier than to solve the problem without knowing them. The natural man comes, indignant and strong, and topples the justice accumulated in books, because it is not administered to him in accordance with the manifest"}, {"e": 0, "t": "needs of the country. To know is to solve. To know the country, and to govern it in accordance with that knowledge, is the only way to free it from tyrannies. The European university must yield to the American university. The history of America, from the Incas onward, must be taught by heart, even if the history of the archons of Greece is not taught. Our own Greece is preferable to the Greece that is not ours. It is more necessary to us. National politicians must replace exotic politicians. Let the world be grafted onto our republics; but the trunk must be that of our republics. And let the vanquished pedant hold his tongue; for there is no homeland in which a man can take greater pride than in our suffering American republics."}, {"e": 0, "t": "With the rosary at our feet, our heads white, and our bodies mottled with Indian and Creole, we came, undaunted, into the world of nations. With the Virgin's standard we went forth to the conquest of liberty. A priest, a handful of lieutenants, and a woman raise up the republic in Mexico, upon the shoulders of the Indians. A Spanish canon, in the shadow of his cloak, instructs a few magnificent graduates in French liberty, and they make the general of Spain the leader of Central America against Spain. In monarchical habits, with the Sun for a breastplate, the Venezuelans in the North and the Argentines in the South set about raising up peoples. When the two heroes clashed, and the continent was about to tremble, one of them, who was not the lesser, turned his reins. And because heroism in peace is rarer,"}, {"e": 0, "t": "being less glorious, than heroism in war; because it is easier for a man to die with honor than to think with order; because to govern amid exalted and unanimous sentiments is more feasible than to direct, after the fight, the diverse, arrogant, exotic, or ambitious thoughts; because the powers swept aside in the epic onslaught were undermining, with the feline cunning of the species and the weight of the real, the edifice that had hoisted, over the crude and singular regions of our mestizo America, over the peoples of bare legs and Paris frock coats, the banner of peoples nourished on governing sap by the continuous practice of reason and of liberty; because the hierarchical constitution of the colonies resisted the democratic organization of the Republic, and the capitals in their cravats left the"}, {"e": 0, "t": "countryside in its horsehide boots waiting in the vestibule, and the bookish redeemers failed to understand that the revolution which triumphed through the soul of the land, unleashed at the voice of the redeemer, had to govern with the soul of the land, and not against it nor without it—America began to suffer, and suffers still, from the weariness of trying to reconcile the discordant and hostile elements it inherited from a despotic and perverse colonizer, with the imported ideas and forms that have gone on delaying, by their lack of local reality, the logical government. The continent, dislocated for three centuries by a rule that denied man the right to the exercise of his reason, entered—disregarding or ignoring the unlettered ones who had helped it to redeem itself—into a government that took reason"}, {"e": 0, "t": "for its base; the reason of all in the things that belong to all, and not the university reason of some over the rustic reason of others. The problem of independence was not the change of forms, but the change of spirit."}, {"e": 0, "t": "With the oppressed a common cause had to be made, in order to secure the system opposed to the interests and the habits of command of the oppressors. The tiger, frightened off by the flash of the gun, comes back by night to the place of its prey. It dies with flames shooting from its eyes and its claws in the air. It is not heard coming, for it comes with velvet paws. When the prey awakens, the tiger is upon it. The colony went on living on in the republic; and our America is saving itself from its great errors—from the arrogance of the capital cities, from the blind triumph of the scorned peasants, from the excessive importation of foreign ideas and formulas, from the iniquitous and impolitic disdain of the aboriginal race—through the superior virtue, fertilized with necessary blood, of the republic that"}, {"e": 0, "t": "struggles against the colony. The tiger waits, behind every tree, crouched at every corner. It will die, with its claws in the air, with flames shooting from its eyes."}, {"e": 0, "t": "But \"these countries will be saved,\" as the Argentine Rivadavia announced—he who sinned by refinement in raw times: the machete does not take to a silken sheath, nor, in the country that was won with the lance, can the lance be cast aside, for it grows angry and plants itself at the door of Iturbide's Congress \"to see the fair-haired one made emperor.\" These countries will be saved because, through the genius of moderation that seems to prevail, by the serene harmony of Nature, in the continent of the light, and through the influence of the critical reading that has succeeded, in Europe, the groping and phalanstery reading in which the earlier generation was steeped, the real man is being born to America in these real times."}, {"e": 0, "t": "We were a vision, with the chest of an athlete, the hands of a fop, and the forehead of a child. We were a mask, with the breeches of England, the Parisian waistcoat, the North American overcoat, and the cap of Spain. The Indian, mute, circled around us, and went off to the mountain, to the summit of the mountain, to baptize his children. The Negro, watched, sang in the night the music of his heart, alone and unknown, amid the waves and the wild beasts. The peasant, the creator, turned in blind indignation against the disdainful city, against his own creature. We were epaulets and judges' robes, in countries that came into the world with rope sandals on their feet and a band about their heads. The genius would have been to bring together, with the charity of the heart and with the daring of the founders, the"}, {"e": 0, "t": "headband and the robe; to unstop the Indian; to make room enough for the able Negro; to fit liberty to the bodies of those who rose up and conquered for it. There remained to us the judge, and the general, and the man of letters, and the prebendary. The angelic youth, as if from the arms of an octopus, cast heavenward its head, crowned with clouds, only to fall back in sterile glory. The natural people, with the thrust of instinct, overran, blind with triumph, the staves of gold. Neither the European book nor the Yankee book gave the key to the Spanish American enigma. Hatred was tried, and the countries came, year by year, to less. Weary of the useless hatred, of the resistance of the book against the lance, of reason against the processional candle, of the city against the countryside, of the impossible"}, {"e": 0, "t": "empire of the divided urban castes over the natural nation, tempestuous or inert, they begin, almost without knowing it, to try love. The peoples rise to their feet and greet one another. \"What are we like?\" they ask; and one tells another what it is like. When a problem arises in Cojímar, they do not go to Danzig for the solution. The frock coats are still from France, but the thought begins to be American. The young men of America are rolling up their sleeves, plunging their hands into the dough, and raising it with the leaven of their own sweat. They understand that there is too much imitation, and that salvation lies in creating. To create is the watchword of this generation. The wine is of plantain; and if it comes out sour, it is our wine! It is understood that the forms of a country's government must"}, {"e": 0, "t": "accommodate themselves to its natural elements; that absolute ideas, if they are not to fall through a flaw of form, must be put into relative forms; that liberty, to be viable, must be sincere and whole; that if the republic does not open its arms to all and advance with all, the republic dies. The tiger within comes in through the crack, and so does the tiger without. The general, on the march, holds back the cavalry to the pace of the infantry. Or if he leaves the infantry behind, the enemy surrounds his cavalry. Strategy is politics. The peoples must live criticizing themselves, for criticism is health; but with a single breast and a single mind. Let us lower ourselves to the unfortunate and raise them up in our arms! Let us thaw with the fire of the heart the coagulated America! Let us set the natural"}, {"e": 0, "t": "blood of the country coursing, surging and leaping, through its veins! On their feet, with the glad eyes of laborers, the new American men greet one another from one people to another. The natural statesmen arise from the direct study of nature. They read in order to apply, but not in order to copy. The economists study the difficulty at its origins. The orators begin to be sober. The dramatists bring native characters onto the stage. The academies debate viable themes. Poetry cuts off its Zorrilla-esque mane and hangs its red waistcoat on the glorious tree. Prose, sparkling and sifted, comes laden with ideas. The governors, in the republics of Indians, are learning Indian."}, {"e": 0, "t": "From all its dangers America is saving itself. Over some republics the octopus lies sleeping. Others, by the law of equilibrium, rush on foot into the sea, to recover, with a mad and sublime haste, the lost centuries. Others, forgetting that Juárez used to ride about in a mule-drawn carriage, hitch a carriage of wind, with a coachman of wind, to a soap bubble; poisonous luxury, the enemy of liberty, corrupts the frivolous man and opens the door to the foreigner. Others refine the virile character, with the epic spirit of a threatened independence. Others breed, in rapacious war against their neighbor, the soldiery that may one day devour them. But our America may run another danger, which comes to it not from itself, but from the difference in origins, methods, and interests between the two continental"}, {"e": 0, "t": "factors, and that is the imminent hour in which an enterprising and forceful people, which does not know it and looks down on it, will draw near to it, demanding intimate relations. And since virile peoples, who have made themselves by their own effort, with the musket and the law, love, and love only, virile peoples; since the hour of license and of ambition—from which North America may perhaps free itself, through the predominance of the purest part of its blood, or into which its vengeful and sordid masses, the tradition of conquest, and the interest of a clever caudillo might fling it—is not yet so near to the eyes of even the most fearful that there is no time left for the test of pride, continuous and discreet, with which it might be faced and turned aside; since its decorum as a republic places upon"}, {"e": 0, "t": "North America, before the attentive peoples of the Universe, a restraint that cannot be removed by the puerile provocation or the ostentatious arrogance or the parricidal discord of our America—the urgent duty of our America is to show itself as it is, one in soul and in purpose, swift conqueror of a suffocating past, stained only with the blood of fertilizer that the fight against the ruins tears from the hands, and that of the veins our masters left punctured in us. The disdain of the formidable neighbor, who does not know it, is the greatest danger of our America; and it is urgent, because the day of the visit is near, that the neighbor come to know it, come to know it soon, so that it will not disdain it. Out of ignorance, it might perhaps come to lay greedy hands upon it. Out of respect, once it came to"}, {"e": 0, "t": "know it, it would take its hands away. One must have faith in the best in man and mistrust the worst in him. One must give the best its chance to reveal itself and prevail over the worst. If not, the worst prevails. The peoples must keep a pillory for whoever goads them to useless hatreds; and another for whoever fails to tell them the truth in time."}, {"e": 0, "t": "There is no hatred of races, because there are no races. The sickly thinkers, the lamp-light thinkers, thread together and reheat the bookshelf races, which the just traveler and the cordial observer seek in vain in the justice of Nature, where there stands out, in victorious love and in turbulent appetite, the universal identity of man. The soul, equal and eternal, emanates from bodies diverse in form and in color. He sins against Humanity who fosters and spreads the opposition and the hatred of races. But within the kneading of peoples there condense, in the nearness of other diverse peoples, peculiar and active characters, of ideas and of habits, of expansion and of acquisition, of vanity and of avarice, which, from the latent state of national preoccupations, could, in a period of internal disorder or of"}, {"e": 0, "t": "the acceleration of the country's accumulated character, turn into a grave menace for the neighboring lands, isolated and weak, which the strong country declares to be perishable and inferior. To think is to serve. Nor must one suppose, out of village antipathy, an innate and fatal wickedness in the fair-haired people of the continent, because it does not speak our language, nor see the house as we see it, nor resemble us in its political blemishes, which are different from ours, nor hold in high regard the choleric, swarthy men, nor look charitably, from its still ill-secured eminence, upon those who, with less favor from History, climb by heroic stages the road of the republics: nor must the plain facts of the problem be hidden—a problem that can be solved, for the peace of the centuries, by timely study"}, {"e": 0, "t": "and by the tacit and urgent union of the continental soul. For already the anthem rings out in unison; the present generation carries on its back, along the road fertilized by the sublime fathers, the laboring America; from the Bravo to Magellan, seated on the back of the condor, the Great Semí scattered, over the romantic nations of the continent and over the suffering islands of the sea, the seed of the new America!"}, {"e": 1, "t": "\"Racist\" is becoming a confused word, and it must be set right. No man has any special right because he belongs to one race or another: say \"man,\" and you have already said all his rights. The black man, for being black, is neither inferior nor superior to any other man; the white man who says \"My race\" sins by redundancy; the black man who says \"My race\" sins by redundancy. Everything that divides men, everything that classifies, separates, or pens them in, is a sin against humanity. What sensible white man imagines he should preen himself on being white, and what do black men think of the white man who preens himself on being so and believes he holds special rights for being so? What must white men think of the black man who takes pride in his color? To insist on the divisions of race, on the differences"}, {"e": 1, "t": "of race, in a people naturally divided, is to obstruct both public and individual happiness, which lie in the greater drawing together of the elements that must live in common. If it is said that in the black man there is no original sin nor any taint that disables him from unfolding the whole of his soul as a man, the truth is being spoken, and it must be spoken and demonstrated, for the injustice of this world is great, and great is the ignorance that passes for wisdom, and there are still those who in good faith believe the black man incapable of the intelligence and heart of the white man; and if this defense of nature is called racism, it does not matter that it be called so, for it is nothing more than natural decency and a voice that cries out from the breast of man for the peace and the life of the"}, {"e": 1, "t": "country. If the enslaved race moves away from the condition of slavery, this does not accuse it of inferiority, since the white Gauls, with blue eyes and golden hair, were sold as serfs, with the iron collar about their necks, in the markets of Rome; that is good racism, because it is pure justice and helps to strip the ignorant white man of his prejudices. But there just racism ends, which is the black man's right to maintain and to prove that his color does not deprive him of any of the capacities and rights of the human species."}, {"e": 1, "t": "The white racist, who credits his race with superior rights, what right has he to complain of the black racist who likewise sees a distinction in his own race? The black racist, who sees in race a special character, what right has he to complain of the white racist? The white man who, by reason of his race, believes himself superior to the black man, admits the idea of race and so authorizes and provokes the black racist. The black man who proclaims his race—when what he perhaps proclaims, uniquely, in this mistaken form, is the spiritual identity of all races—authorizes and provokes the white racist. Peace demands the rights common to nature; differential rights, contrary to nature, are the enemies of peace. The white man who isolates himself isolates the black man. The black man who isolates himself"}, {"e": 1, "t": "In Cuba there is no fear of a war of races. Man is more than white, more than mulatto, more than black. On the fields of battle the souls of white men and of black men have died together for Cuba, have risen together through the air. In the daily life of defense, of loyalty, of brotherhood, of shrewdness, beside every white man there was always a black man. Black men, like white men, are divided by their characters, timid or valiant, self-denying or selfish, into the various parties in which men gather. Political parties are aggregates of concerns, of aspirations, of interests, and of characters. The essential likeness seeks and finds itself above the differences of detail; and what is fundamental in analogous characters fuses within the parties, even though they differ in what is incidental or subordinate"}, {"e": 1, "t": "to the common aim. But in sum, the likeness of characters—superior as a factor of union to the internal relations of one color of men, graded and at times opposed within its own gradation—decides and reigns in the formation of parties. The affinity of characters is more powerful among men than the affinity of color. Black men, distributed among the diverse or hostile specialties of the human spirit, will never be able to league themselves, nor will they wish to league themselves, against the white man, distributed among those same specialties. Black men are too weary of slavery to enter voluntarily into the slavery of color. Men of pomp and self-interest will go to one side, white or black; and generous and disinterested men will go to the other. True men, black or white, will deal with one another in"}, {"e": 1, "t": "loyalty and tenderness, for the pleasure of merit and the pride in all that honors the land where we were born, black or white. The word \"racist\" will fall from the lips of the black men who use it today in good faith, when they understand that it is the only argument of seeming validity, and of real force among sincere and easily frightened men, for denying the black man the fullness of his rights as a man. Two racists would be equally guilty: the white racist and the black racist. Many white men have already forgotten their color, and many black men too. Together they work, white men and black men, for the cultivation of the mind, for the propagation of virtue, for the triumph of creative labor and of sublime charity."}, {"e": 1, "t": "In Cuba there is never a war of races. The Republic cannot turn back; and the Republic, from the single day of the black man's redemption in Cuba, from the first constitution of independence on the tenth of April at Guáimaro, never spoke of white men or of black men. The public rights, already granted out of pure shrewdness by the Spanish Government and established in custom before the independence of the Island, can no longer be denied, neither by the Spaniard, who will uphold them as long as he draws breath in Cuba in order to go on dividing the black Cuban from the white Cuban, nor by independence, which could not deny in freedom the rights that the Spaniard acknowledged in servitude."}, {"e": 1, "t": "And for the rest, each man shall be free in the sanctuary of his home. Merit, the plain and continuous proof of culture, and inexorable commerce will at last unite men. In Cuba there is much greatness in black men and white men alike."}, {"e": 2, "t": "New York, March 21, 1889 To the Editor of The Evening Post Sir: I beg you to allow me to refer, in your columns, to the offensive slur upon the Cubans published in The Manufacturer of Philadelphia, and reproduced with approval in your issue of yesterday."}, {"e": 2, "t": "This is not the moment to discuss the question of the annexation of Cuba. It is probable that no Cuban who holds his dignity in any esteem would wish to see his country joined to another whose leaders of opinion share, regarding it, the prejudices that are excusable only in a swaggering politics or in disorderly ignorance. No honorable Cuban will so humble himself as to be received, for the mere worth of his land, as a moral pariah into a nation that denies his capacity, insults his virtue, and scorns his character. There are Cubans who, from respectable motives—from an ardent admiration for progress and liberty, from a foreboding of their own strength under better political conditions, from an unhappy ignorance of the history and tendency of annexation—would wish to see the Island bound to the United"}, {"e": 2, "t": "States. But those who have fought in the war and have learned in exile; those who have built, with the labor of hand and mind, a virtuous home in the heart of a hostile people; those whose recognized merit as scientists and merchants, as managers and engineers, as teachers, lawyers, artists, journalists, orators, and poets, as men of quick intelligence and uncommon energy, has earned them honor wherever there has been occasion to display their qualities and justice enough to understand them; those who, with their less prepared elements, founded a city of workingmen where the United States had before but a few shanties on a deserted islet—these, more numerous than the others, do not desire the annexation of Cuba to the United States. They do not need it. They admire this nation, the greatest ever raised by"}, {"e": 2, "t": "liberty; but they distrust the baneful elements that, like worms in the blood, have begun in this prodigious Republic their work of destruction. They have made the heroes of this country their own heroes, and they long for the definitive success of the North American Union as the highest glory of mankind; but they cannot honestly believe that an excessive individualism, the worship of wealth, and the prolonged exultation of a terrible victory are preparing the United States to be the typical nation of liberty, where there shall be no opinion grounded in an immoderate appetite for power, nor any acquisition or triumph contrary to goodness and justice. We love the homeland of Lincoln as much as we fear the homeland of Cutting."}, {"e": 2, "t": "We Cubans are not that nation of wretched vagabonds or immoral pygmies that The Manufacturer is pleased to describe; nor the country of useless praters, incapable of action, enemies of hard work, that, together with the other peoples of Spanish America, arrogant travelers and writers are wont to paint. We have suffered impatiently under tyranny; we have fought like men, and sometimes like giants, to be free; we are passing through that period of turbulent repose, full of the seeds of revolt, that naturally follows a period of excessive and unfortunate action; we have to struggle, as the vanquished, against an oppressor who deprives us of the means of living and who favors—in the beautiful capital the foreigner visits, and in the interior of the country, where the prey escapes his clutch—the reign of a"}, {"e": 2, "t": "corruption so great that it comes to poison in our blood the strength we need to conquer liberty. In the hour of our misfortune we deserve the respect of those who did not help us when we sought to shake it off."}, {"e": 2, "t": "But because our government has systematically permitted, since the war, the triumph of criminals, the occupation of the city by the dregs of the people, the ostentation of ill-gotten riches by a myriad of Spanish officeholders and their Cuban accomplices, the conversion of the capital into a house of immorality, where the philosopher and the hero live without bread beside the magnificent thief from the mother country; because the honest countryman, ruined by a war that seems in vain, returns in silence to the plow that in its hour he knew how to exchange for the machete; because thousands of exiles, availing themselves of a season of calm that no human power can hasten until it burns itself out, are practicing, in the battle of life among free peoples, the art of governing themselves and of building a"}, {"e": 2, "t": "nation; because our men of mixed blood and our city youths are generally of delicate frame, voluble and courteous, hiding beneath the glove that polishes the verse the hand that fells the enemy—are we to be called, as The Manufacturer calls us, an effeminate people? Those city youths and men of mixed blood, slight of body, knew how to rise in a single day against a cruel government; to pay their passage to the seat of war with the proceeds of their watch and their trinkets; to live by their labor while the land of the free held back their ships in the interest of the enemies of liberty; to obey as soldiers, to sleep in the mud, to eat roots, to fight ten years without pay, to vanquish the enemy with the branch of a tree, to die—these men of eighteen, these heirs of powerful houses, these olive-skinned lads—a"}, {"e": 2, "t": "death of which no one should speak but with his head uncovered; they died as those other men of ours die who know how, with a stroke of the machete, to send a head flying, or, with a turn of the hand, to bring a bull to its knees. These effeminate Cubans once had courage enough to wear, for a week, upon their arm, face to face with a despotic government, the mourning for Lincoln."}, {"e": 2, "t": "The Cubans, says The Manufacturer, have \"an aversion to all effort,\" \"do not know how to shift for themselves,\" \"are lazy.\" These \"lazy\" men who \"do not know how to shift for themselves\" came here twenty years ago with empty hands, save for a few exceptions; they struggled against the climate; they mastered the foreign tongue; they lived by their honest labor, some in ease, a few in wealth, rarely in want; they bought or built their homes; they created families and fortunes; they loved luxury, and worked for it; they were not often to be seen in the dark byways of life: independent, and sufficient unto themselves, they feared competition neither in aptitude nor in energy: thousands have gone back to die in their homes: thousands remain where, through the hardships of life, they have ended by triumphing,"}, {"e": 2, "t": "without the help of a friendly language, a common religion, or the sympathy of race. A handful of Cuban workingmen raised up Key West. The Cubans have distinguished themselves in Panama by their merit as artisans in the noblest trades, as employees, physicians, and contractors. A Cuban, Cisneros, has contributed powerfully to the advancement of the railroads and river navigation of Colombia. Márquez, another Cuban, won, like many of his countrymen, the respect of Peru as an eminent merchant. Everywhere the Cubans are living, working as farmers, as engineers, as surveyors, as artisans, as teachers, as journalists. In Philadelphia, The Manufacturer has daily occasion to see a hundred Cubans, some of them of heroic history and vigorous body, who live by their labor in comfortable abundance. In New York the"}, {"e": 2, "t": "Cubans are directors in prominent banks, prosperous merchants, well-known brokers, clerks of notable talent, physicians with a native clientele, engineers of worldwide reputation, electricians, journalists, owners of establishments, artisans. The poet of Niagara is a Cuban, our Heredia. A Cuban, Menocal, is chief of the engineers of the Nicaragua canal. In Philadelphia itself, as in New York, the first prize of the Universities has been, more than once, a Cuban's. And the women of these \"lazy\" men, who \"do not know how to shift for themselves,\" these enemies of \"all effort,\" came here, fresh from a sumptuous existence, in the harshest depth of winter: their husbands were at the war, ruined, imprisoned, dead: the \"lady\" set to work: the mistress of slaves became a slave; she sat down behind a counter; she"}, {"e": 2, "t": "sang in the churches; she stitched buttonholes by the hundred; she sewed for hire; she curled the feathers of milliners; she gave her heart to duty; she withered her body with toil: this is the people \"deficient in morality\"!"}, {"e": 2, "t": "We are \"unfitted by nature and experience to fulfill the obligations of citizenship in a great and free country.\" This cannot in justice be said of a people that possesses—together with the energy that built the first railroad in the Spanish dominions and set up, against a tyrannical government, all the resources of civilization—a truly remarkable knowledge of the body politic, a demonstrated aptitude to adapt itself to its higher forms, and the power, rare in the lands of the tropics, of strengthening its thought and pruning its language. The passion for liberty, the serious study of its best teachings, the development of individual character in exile and in its own country, the lessons of ten years of war and of its manifold consequences, and the practical exercise of the duties of citizenship among the"}, {"e": 2, "t": "free peoples of the world have contributed, in spite of all hostile antecedents, to develop in the Cuban an aptitude for free government so natural in him that he established it, even to excess of practices, in the midst of the war, struggled with his elders in the zeal to see the laws of liberty respected, and wrenched the sword, without deference or fear, from the hands of all the military pretenders, however glorious they might be. It would seem that there is in the Cuban mind a happy faculty of uniting sense to passion, and moderation to exuberance. Since the beginning of the century, noble teachers have devoted themselves to explaining by their word, and practicing in their lives, the self-denial and tolerance inseparable from liberty. Those who ten years ago won by singular merit the foremost places in"}, {"e": 2, "t": "the European Universities have been hailed, on their appearance in the Spanish Parliament, as men of sober thought and powerful eloquence. The political knowledge of the common Cuban compares without disadvantage with that of the common citizen of the United States. The absolute absence of religious intolerance, the love of the man for the property acquired by the labor of his hands, and the familiarity, in practice and in theory, with the laws and procedures of liberty, will fit the Cuban to rebuild his country upon the ruins in which he will receive it from his oppressors. It is not to be expected, for the honor of the human race, that the nation that had liberty for its cradle, and received during three centuries the best blood of free men, should employ the power thus amassed to deprive of their liberty"}, {"e": 2, "t": "The Manufacturer ends by saying \"that our lack of manly vigor and self-respect is shown by the apathy with which we have so long submitted to Spanish oppression,\" and that \"our very attempts at rebellion have been so pitifully ineffective that they rise little above the dignity of a farce.\" Never was greater ignorance of history and of character displayed than in this most frivolous assertion. It must be remembered, so as not to answer it with bitterness, that more than one American shed his blood at our side in a war that another American was to call \"a farce.\" A farce, the war that has been likened by foreign observers to an epic—the rising of a whole people, the voluntary abandonment of wealth, the abolition of slavery in our first moment of liberty, the burning of our cities with our own hands, the"}, {"e": 2, "t": "creation of towns and factories in the virgin forests, the clothing of our women with the fabrics of the trees, the holding at bay, through ten years of such a life, of a powerful adversary who lost two hundred thousand men at the hands of a small army of patriots, with no help but that of nature! We had no Hessians and no Frenchmen, no Lafayette or Steuben, no rivalries of kings to aid us: we had but a neighbor who \"extended the limits of his power, and acted against the will of the people,\" to favor the enemies of those who were fighting for the same charter of liberty upon which he founded his independence: we fell victims to the very passions that would have caused the fall of the Thirteen States, had not success united them, while delay weakened us—delay caused not by cowardice, but by our horror of"}, {"e": 2, "t": "blood, which in the first months of the struggle allowed the enemy to take an irreparable advantage, and by a childlike confidence in the certain aid of the United States: \"They will not see us die for liberty at their own doors without raising a hand or saying a word to give a new free people to the world!\" They \"extended the limits of their power,\" in deference to Spain. They did not raise the hand. They did not say the word."}, {"e": 2, "t": "The struggle has not ceased. The exiles do not wish to return. The new generation is worthy of its fathers. Hundreds of men have died, since the war, in the mystery of the prisons. Only with life will the battle for liberty cease among us. And it is the sad truth that our efforts would, in all probability, have been renewed with success, had it not been, in some of us, for the unmanly hope of the annexationists of obtaining liberty without paying its price, and for the just fear of others that our dead, our sacred memories, our ruins soaked in blood, should come to be no more than the manure of the soil for the growth of a foreign plant, or the occasion of a jeer for The Manufacturer of Philadelphia. I am, Sir, your attentive servant, José Martí New York, March 21, 1889 120 Front Street"}, {"e": 3, "t": "New York, April 1884 The tendency toward socialism of present-day governments. –The excessive action of the State. –Dwellings for the poor. –The nationalization of the land. –Officialdom. \"The Coming Slavery\" is the name of this treatise by Herbert Spencer. That future slavery, which Spencer studies in the manner of a Greek citizen who reckoned the common people as counting for little, is socialism. English literature still carries itself high, as though dressed in the robes of a lord; and this disdain and lordliness, which lend it originality and character, deprive it in turn of that more desirable universal influence to which, by the depth of its thought and the melody of its form, it would have a right. He who does not take communion at the altar of men is justly unknown by them."}, {"e": 3, "t": "How is socialism to come about, and how is it to become a new slavery? Spencer judges as mounting victories of the socialist idea, and as feeble concessions by the seekers of popularity, that most noble tendency—born precisely to make socialism unnecessary—which springs from all those generous thinkers who see how the just discontent of the lower classes leads them to desire radical and violent improvements, and who find no more natural way of curing the harm at its root than to remove the motive for discontent. But this must be done in such a way that the relief of the poor is not turned into the fostering of idlers; and it is to this that the laws dealing with relief must be directed, rather than to leaving the humble folk with all their reasons for revolt intact."}, {"e": 3, "t": "Under the pretext of succoring the poor—says Spencer—so many levies are exacted that those who are not poor are turned into poor. The law that established parish relief for the poor made the number of poor greater. The law that created a certain bounty for the mothers of illegitimate children was the cause that men preferred such women for wives over honest young girls, because the former brought the bounty as a dowry. If the poor grow accustomed to asking everything of the State, they will soon cease to make any effort toward their own subsistence, unless they are smoothed along by the State's providing them with work. The poor are already aided in a thousand forms. Now it is wished that the government should build them edifices. It is demanded that, just as the government owns the telegraph and the post,"}, {"e": 3, "t": "it should own the railroads. On the day the State becomes a builder, Spencer believes that, since builders will draw less profit from houses, they will not build, and the State will come to be the sole builder—an argument which, although it comes from a formidable reasoner, does not stand well upon its feet. And on the day the State becomes owner of the railroads, it will usurp all the industries connected with them and enter into rivalry with the whole diverse multitude of manufacturers—a line of reasoning which, no less than the other, totters, because railroad enterprises are few and very scarce that themselves fashion the materials they use. And all these interventions of the State Herbert Spencer judges to be caused by the rising tide and imposed by the rabble that demands them, as if the most"}, {"e": 3, "t": "praiseworthy and sensible desire to give the poor clean housing—which heals body and mind alike—had not been born in the very ranks of cultured people, without the unworthy idea of courting popular favor; and as if that other attempt to give the railroads over to the State did not have, along with various drawbacks, high moralizing aims, such as that of gradually doing away with the corrupting games of the stock exchange, and were not nourished in several countries at one and the same time, among people who certainly do not frequent taverns or hovels."}, {"e": 3, "t": "Spencer fears, not without foundation, that when the action of the State comes to be so varied, active, and dominant, the State would have to impose considerable burdens upon the working portion of the nation for the benefit of the pauper portion. And it is true that if benevolence were to reach such a point that the paupers no longer needed to work in order to live—which they will never be able to reach—individual action would gradually weaken, and the condition of those who hold some wealth would grow heavier, without this being enough to quiet the needs and appetites of those who have none. He fears, moreover, the accumulation of additional and ever more extensive laws that the regulation of the earlier pauper laws brings about; but this comes from the wish to legislate the forms of the evil, and to cure"}, {"e": 3, "t": "it in its manifestations, when what it must be cured of is at its base—which lies in the miring, the wormrot, and the putrefaction in which the lower classes of the great cities live; and from whose misery—at a cost that would certainly not drive from the market the builders of houses of richer style, and without the risks Spencer exaggerates—they may doubtless be greatly helped out by the clean, artistic, luminous, and airy houses that it is rightly proposed to give to the workers; for the human spirit has a natural tendency toward goodness and culture, and in the presence of what is lofty, it rises, and in the presence of what is clean, it cleans itself. Besides, by giving cheap houses to the poor, the only aim is to give them good dwellings at the same price they pay today for infected shanties."}, {"e": 3, "t": "Set upon these fixed bases—to which the exaggerated demands of the radicals and of the Democratic Federation lend a certain greater solidity in English politics—Spencer constructs the edifice to come, truly dark, and resembling that of the Peruvians before the conquest and that of Gaul in the decadence of Rome, in which epochs the citizen received everything from the State, in compensation for the work the citizen did for the State."}, {"e": 3, "t": "Henry George goes about preaching the justice of having the land pass into the ownership of the nation; and the Democratic Federation yearns for the formation of \"industrial and agricultural armies led by the State.\" By burdening with more levies, in order to meet the new demands, the lands of low yield, the yield of these will come to be null, and the nation—to which in the end everything comes from the land—will have fewer fruits, and it will become necessary for the State to organize compulsory cultivation. Such enterprises would increase in terrible fashion the number of public employees, already excessive. With each new function would come a new caste of functionaries. Already in England, as almost everywhere, there is too great a fondness for occupying public posts, held to be more distinguished than"}, {"e": 3, "t": "any others, and in which an ample and certain remuneration is obtained for relatively scant work; whereby it is clear that the national nerve is lost. Ill fares a nation of office-holders!"}, {"e": 3, "t": "All the power that the caste of functionaries would go on acquiring, bound together by the need to maintain themselves in a privileged and lucrative occupation, the people would go on losing—a people that does not have the same reasons of complicity in hopes and gains with which to confront the functionaries linked by common interests. As all public needs would come to be satisfied by the State, the functionaries would then acquire the enormous influence that naturally comes to those who distribute some right or benefit. The man who now wants the State to take care of him so that he need not take care of himself would then have to work in the measure, for the time, and in the labor that it pleased the State to assign him, since to the State—upon which all duties would fall—would naturally be given all the"}, {"e": 3, "t": "faculties necessary to secure the means of fulfilling them. From being the servant of himself, man would pass to being the servant of the State. From being the slave of the capitalists, as it is now called, he would go on to being the slave of the functionaries. A slave is anyone who works for another who has dominion over him; and in that socialist system the community would dominate the man, who would hand over all his labor to the community.
