<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>José Martí, in his own words.</title>
<link rel="manifest" href="manifest.webmanifest?v=3"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Martí"><link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--fg:#fff;--muted:#9a9a9a;--line:#2a2a2a;}
  *{box-sizing:border-box;} html,body{margin:0;background:var(--bg);color:var(--fg);}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:300;font-size:16px;line-height:1.65;min-height:100vh;}
  .wrap{max-width:720px;margin:0 auto;padding:24px 20px;}
  body:not(.has-results) .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  h1{font-weight:200;font-size:25.2px;line-height:1.2;letter-spacing:-.02em;margin:0 0 20px;}
  form{display:flex;gap:10px;width:100%;max-width:560px;}
  input{flex:1;padding:14px 16px;font-size:16px;font-family:inherit;font-weight:inherit;background:#000;color:#fff;border:1px solid #fff;border-radius:10px;outline:none;}
  input::placeholder{color:#666;} input:focus{box-shadow:0 0 0 2px #fff inset;}
  button.go{padding:14px 18px;font-size:15px;font-family:inherit;font-weight:500;border:1px solid #fff;border-radius:10px;background:#fff;color:#000;cursor:pointer;}
  .toggle{display:inline-flex;margin:14px 0 0;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .toggle button{padding:7px 18px;font:inherit;font-size:13px;font-weight:400;background:transparent;color:var(--muted);border:0;cursor:pointer;}
  .toggle button.on{background:#fff;color:#000;}
  .note{margin:12px 0 0;color:#5b5b62;font-size:12px;}
  #status{margin-top:16px;color:var(--muted);font-size:13px;min-height:16px;}
  .results{margin-top:24px;width:100%;}
  .card{padding:18px 0;border-top:1px solid var(--line);cursor:pointer;}
  .quote{font-size:17px;line-height:1.55;}
  .etitle{font-size:19px;font-weight:400;}
  .snip{color:var(--muted);font-size:14px;margin-top:6px;}
  .meta{margin-top:9px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;}
  .score{font-variant-numeric:tabular-nums;opacity:.6;}
  /* results = white/black */
  html.has-results{background:#fff;}
  body.has-results{background:#fff;color:#000;}
  body.has-results .wrap{padding-top:40px;}
  body.has-results h1{color:#000;}
  body.has-results input{background:#fff;color:#000;border-color:#000;} body.has-results input:focus{box-shadow:0 0 0 2px #000 inset;}
  body.has-results button.go{background:#000;color:#fff;border-color:#000;}
  body.has-results .toggle{border-color:#ddd;} body.has-results .toggle button{color:#666;} body.has-results .toggle button.on{background:#000;color:#fff;}
  body.has-results .card{border-top-color:#e4e4e4;}
  body.has-results .meta,body.has-results .snip{color:#666;}
  /* reader overlay */
  #reader{position:fixed;inset:0;background:#fff;color:#111;z-index:9000;overflow-y:auto;display:none;}
  #reader .rwrap{max-width:720px;margin:0 auto;padding:30px 22px 90px;}
  #reader .back{position:sticky;top:0;background:#fff;padding:8px 0 14px;font-size:15px;color:#000;border:0;cursor:pointer;font-family:inherit;}
  #reader h2{font-weight:500;font-size:26px;line-height:1.2;margin:6px 0 4px;}
  #reader .by{color:#777;font-size:13px;font-style:italic;margin-bottom:20px;}
  #reader p{font-size:17px;line-height:1.7;margin:0 0 16px;}
  /* splash */
  #splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity .7s ease;}
  #splash img{width:min(33vw,120px);height:auto;display:block;border:0;}
  #splash.hide{opacity:0;pointer-events:none;}
</style></head>

<script type="application/json" id="essays">[{"t": "Our America", "b": "José Martí — Mexico, January 30, 1891", "x": "The vain villager believes that the whole world is his village, and so long as he can stay on as mayor, or torment the rival who stole his sweetheart, or watch his savings grow in their money box, he holds the order of the universe to be good, knowing nothing of the giants in seven-league boots who can set a boot upon him, nor of the battle of the comets in the Heavens, which go through the air, asleep, gulping down worlds. Whatever is left of the village in America must awaken. These are not times for lying down to sleep with a handkerchief about the head, but with weapons for a pillow, like the men of Juan de Castellanos: the weapons of the mind, which conquer all others. Trenches of ideas are worth more than trenches of stone.\n\nThere is no prow that can cut through a cloud of ideas. A vigorous idea, flashed in time before the world, can stop, like the mystical banner of the Last Judgment, a squadron of ironclads. Peoples that do not know one another must hasten to know one another, like men who are about to fight together. Those who shake their fists at each other, like jealous brothers coveting the same tract of land, or like the man in the small house who envies the man in the better one, must clasp their two hands together until they become one. Those who, under the shelter of a criminal tradition, lopped off, with the sword stained by the blood of their own veins, the land of the vanquished brother, the brother punished far beyond his faults, must give that brother back his lands, if they do not wish the people to call them thieves. The debts of honor the honorable man does not collect in money, so much per slap in the face. We can no longer be a people of leaves, living in the air, our crown heavy with bloom, crackling or humming at the caprice of the light's caress, or beaten and felled by the tempests: the trees must close ranks, so that the giant with the seven-league boots cannot pass! It is the hour of the muster and of the united march, and we must advance in close array, like silver in the roots of the Andes.\n\nOnly the seven-month runts will be found wanting in courage. Those who have no faith in their land are men born at seven months. Because they themselves lack courage, they deny it to others. The sickly arm, the arm with painted nails and a bracelet, the arm of Madrid or of Paris, cannot reach the lofty tree, and so they say the tree cannot be reached. The ships must be loaded with these harmful insects that gnaw at the bone of the homeland that nourishes them. If they are Parisians or Madrileños, let them stroll to the Prado, among the lamplights, or to Tortoni's, for a sherbet. These sons of a carpenter who are ashamed that their father is a carpenter! These men born in America who are ashamed of the mother who reared them, because she wears an Indian apron, and who disown, the scoundrels, their sick mother, and leave her alone on her bed of illness! Well then, which is the true man? He who stays with his mother to nurse her through her illness, or he who sets her to work out of sight and lives off her sustenance in rotten lands, with a worm for a necktie, cursing the bosom that bore him, parading on the back of his paper frock coat the placard of a traitor? These sons of our America, which must be saved through its Indians, and which is rising from less to more; these deserters who beg for a rifle in the armies of North America, which drowns its own Indians in blood, and which is sinking from more to less! These dainty creatures who are men and will not do the work of men! Did the Washington who made this land for them go off to live with the English, to live with the English in the very years when he saw them marching against his own country? These \"incredibles\" of honor, who drag it through foreign dirt, as the Incredibles of the French Revolution, dancing and smacking their lips, drew out their r's!\n\nAnd in what homeland can a man take greater pride than in our suffering republics of America, raised up among the mute masses of Indians, to the sound of battle between the book and the processional candle, upon the bloodied arms of a hundred apostles? Out of factors so disordered, never, in a shorter span of history, were nations so advanced and so compact ever created. The arrogant man believes that the earth was made to serve as his pedestal, because his pen runs easily or his words come in bright colors, and he accuses his native republic of being incapable and beyond remedy, because its young jungles do not grant him a steady means of going about the world as a celebrated grandee, driving Persian ponies and pouring out champagne. The incapacity lies not in the nascent country, which asks for forms that suit it and for a useful greatness, but in those who would govern original peoples, of singular and violent composition, with laws inherited from four centuries of free practice in the United States, from nineteen centuries of monarchy in France. A decree of Hamilton's will not halt the charge of the plainsman's colt. A phrase of Sieyès's will not set flowing again the clotted blood of the Indian race. To govern well, one must attend to what is, there where one governs; and the good governor in America is not the one who knows how the German or the Frenchman is governed, but the one who knows of what elements his own country is made, and how he can lead them all together, so as to arrive, by methods and institutions born from the country itself, at that desirable state in which every man knows himself and exerts himself, and all enjoy the abundance that Nature placed, for everyone, in the land they make fruitful with their labor and defend with their lives. The government must be born of the country. The spirit of the government must be that of the country. The form of the government must conform to the country's own constitution. The government is nothing more than the balance of the natural elements of the country.\n\nThat is why the imported book has been conquered in America by the natural man. The natural men have conquered the artificial men of letters. The native mestizo has conquered the exotic Creole. There is no battle between civilization and barbarism, but only between false erudition and nature. The natural man is good, and he respects and rewards a superior intelligence, so long as that intelligence does not use his submission to harm him, or offend him by passing him over—a thing the natural man does not forgive, ready as he is to recover by force the respect of whoever wounds his sensibility or injures his interest. It is by their accord with these scorned natural elements that the tyrants of America have climbed to power; and they have fallen the moment they betrayed them. The republics have purged, in their tyrannies, their incapacity to know the true elements of the country, to derive from them the form of government, and to govern by means of them. To govern, in a new people, means to create.\n\nIn peoples made up of cultured and uncultured elements, the uncultured will govern, by their habit of attacking and of settling doubts with their own hand, wherever the cultured do not learn the art of government. The uncultured mass is lazy, and timid in matters of the intelligence, and wants to be well governed; but if the government injures it, it shakes it off and governs itself. How are governors to come out of the universities, when there is no university in America that teaches the rudiments of the art of government, which is the analysis of the elements peculiar to the peoples of America? Young men go out into the world to make their guesses, with Yankee or French spectacles, and aspire to direct a people they do not know. In the race of politics, entry should be denied to those who do not know the rudiments of politics. The prize in the competitions should go not to the best ode, but to the best study of the factors of the country in which one lives. In the newspaper, in the lecture hall, in the academy, the study of the country's real factors must be carried forward. To know them is enough, without blindfolds and without evasions; for whoever sets aside, by will or by forgetfulness, a part of the truth, falls in the long run through the very truth he lacked, which grows in the negligence and brings down whatever is raised without it. To solve the problem after knowing its elements is easier than to solve the problem without knowing them. The natural man comes, indignant and strong, and topples the justice accumulated in books, because it is not administered to him in accordance with the manifest needs of the country. To know is to solve. To know the country, and to govern it in accordance with that knowledge, is the only way to free it from tyrannies. The European university must yield to the American university. The history of America, from the Incas onward, must be taught by heart, even if the history of the archons of Greece is not taught. Our own Greece is preferable to the Greece that is not ours. It is more necessary to us. National politicians must replace exotic politicians. Let the world be grafted onto our republics; but the trunk must be that of our republics. And let the vanquished pedant hold his tongue; for there is no homeland in which a man can take greater pride than in our suffering American republics.\n\nWith the rosary at our feet, our heads white, and our bodies mottled with Indian and Creole, we came, undaunted, into the world of nations. With the Virgin's standard we went forth to the conquest of liberty. A priest, a handful of lieutenants, and a woman raise up the republic in Mexico, upon the shoulders of the Indians. A Spanish canon, in the shadow of his cloak, instructs a few magnificent graduates in French liberty, and they make the general of Spain the leader of Central America against Spain. In monarchical habits, with the Sun for a breastplate, the Venezuelans in the North and the Argentines in the South set about raising up peoples. When the two heroes clashed, and the continent was about to tremble, one of them, who was not the lesser, turned his reins. And because heroism in peace is rarer, being less glorious, than heroism in war; because it is easier for a man to die with honor than to think with order; because to govern amid exalted and unanimous sentiments is more feasible than to direct, after the fight, the diverse, arrogant, exotic, or ambitious thoughts; because the powers swept aside in the epic onslaught were undermining, with the feline cunning of the species and the weight of the real, the edifice that had hoisted, over the crude and singular regions of our mestizo America, over the peoples of bare legs and Paris frock coats, the banner of peoples nourished on governing sap by the continuous practice of reason and of liberty; because the hierarchical constitution of the colonies resisted the democratic organization of the Republic, and the capitals in their cravats left the countryside in its horsehide boots waiting in the vestibule, and the bookish redeemers failed to understand that the revolution which triumphed through the soul of the land, unleashed at the voice of the redeemer, had to govern with the soul of the land, and not against it nor without it—America began to suffer, and suffers still, from the weariness of trying to reconcile the discordant and hostile elements it inherited from a despotic and perverse colonizer, with the imported ideas and forms that have gone on delaying, by their lack of local reality, the logical government. The continent, dislocated for three centuries by a rule that denied man the right to the exercise of his reason, entered—disregarding or ignoring the unlettered ones who had helped it to redeem itself—into a government that took reason for its base; the reason of all in the things that belong to all, and not the university reason of some over the rustic reason of others. The problem of independence was not the change of forms, but the change of spirit.\n\nWith the oppressed a common cause had to be made, in order to secure the system opposed to the interests and the habits of command of the oppressors. The tiger, frightened off by the flash of the gun, comes back by night to the place of its prey. It dies with flames shooting from its eyes and its claws in the air. It is not heard coming, for it comes with velvet paws. When the prey awakens, the tiger is upon it. The colony went on living on in the republic; and our America is saving itself from its great errors—from the arrogance of the capital cities, from the blind triumph of the scorned peasants, from the excessive importation of foreign ideas and formulas, from the iniquitous and impolitic disdain of the aboriginal race—through the superior virtue, fertilized with necessary blood, of the republic that struggles against the colony. The tiger waits, behind every tree, crouched at every corner. It will die, with its claws in the air, with flames shooting from its eyes.\n\nBut \"these countries will be saved,\" as the Argentine Rivadavia announced—he who sinned by refinement in raw times: the machete does not take to a silken sheath, nor, in the country that was won with the lance, can the lance be cast aside, for it grows angry and plants itself at the door of Iturbide's Congress \"to see the fair-haired one made emperor.\" These countries will be saved because, through the genius of moderation that seems to prevail, by the serene harmony of Nature, in the continent of the light, and through the influence of the critical reading that has succeeded, in Europe, the groping and phalanstery reading in which the earlier generation was steeped, the real man is being born to America in these real times.\n\nWe were a vision, with the chest of an athlete, the hands of a fop, and the forehead of a child. We were a mask, with the breeches of England, the Parisian waistcoat, the North American overcoat, and the cap of Spain. The Indian, mute, circled around us, and went off to the mountain, to the summit of the mountain, to baptize his children. The Negro, watched, sang in the night the music of his heart, alone and unknown, amid the waves and the wild beasts. The peasant, the creator, turned in blind indignation against the disdainful city, against his own creature. We were epaulets and judges' robes, in countries that came into the world with rope sandals on their feet and a band about their heads. The genius would have been to bring together, with the charity of the heart and with the daring of the founders, the headband and the robe; to unstop the Indian; to make room enough for the able Negro; to fit liberty to the bodies of those who rose up and conquered for it. There remained to us the judge, and the general, and the man of letters, and the prebendary. The angelic youth, as if from the arms of an octopus, cast heavenward its head, crowned with clouds, only to fall back in sterile glory. The natural people, with the thrust of instinct, overran, blind with triumph, the staves of gold. Neither the European book nor the Yankee book gave the key to the Spanish American enigma. Hatred was tried, and the countries came, year by year, to less. Weary of the useless hatred, of the resistance of the book against the lance, of reason against the processional candle, of the city against the countryside, of the impossible empire of the divided urban castes over the natural nation, tempestuous or inert, they begin, almost without knowing it, to try love. The peoples rise to their feet and greet one another. \"What are we like?\" they ask; and one tells another what it is like. When a problem arises in Cojímar, they do not go to Danzig for the solution. The frock coats are still from France, but the thought begins to be American. The young men of America are rolling up their sleeves, plunging their hands into the dough, and raising it with the leaven of their own sweat. They understand that there is too much imitation, and that salvation lies in creating. To create is the watchword of this generation. The wine is of plantain; and if it comes out sour, it is our wine! It is understood that the forms of a country's government must accommodate themselves to its natural elements; that absolute ideas, if they are not to fall through a flaw of form, must be put into relative forms; that liberty, to be viable, must be sincere and whole; that if the republic does not open its arms to all and advance with all, the republic dies. The tiger within comes in through the crack, and so does the tiger without. The general, on the march, holds back the cavalry to the pace of the infantry. Or if he leaves the infantry behind, the enemy surrounds his cavalry. Strategy is politics. The peoples must live criticizing themselves, for criticism is health; but with a single breast and a single mind. Let us lower ourselves to the unfortunate and raise them up in our arms! Let us thaw with the fire of the heart the coagulated America! Let us set the natural blood of the country coursing, surging and leaping, through its veins! On their feet, with the glad eyes of laborers, the new American men greet one another from one people to another. The natural statesmen arise from the direct study of nature. They read in order to apply, but not in order to copy. The economists study the difficulty at its origins. The orators begin to be sober. The dramatists bring native characters onto the stage. The academies debate viable themes. Poetry cuts off its Zorrilla-esque mane and hangs its red waistcoat on the glorious tree. Prose, sparkling and sifted, comes laden with ideas. The governors, in the republics of Indians, are learning Indian.\n\nFrom all its dangers America is saving itself. Over some republics the octopus lies sleeping. Others, by the law of equilibrium, rush on foot into the sea, to recover, with a mad and sublime haste, the lost centuries. Others, forgetting that Juárez used to ride about in a mule-drawn carriage, hitch a carriage of wind, with a coachman of wind, to a soap bubble; poisonous luxury, the enemy of liberty, corrupts the frivolous man and opens the door to the foreigner. Others refine the virile character, with the epic spirit of a threatened independence. Others breed, in rapacious war against their neighbor, the soldiery that may one day devour them. But our America may run another danger, which comes to it not from itself, but from the difference in origins, methods, and interests between the two continental factors, and that is the imminent hour in which an enterprising and forceful people, which does not know it and looks down on it, will draw near to it, demanding intimate relations. And since virile peoples, who have made themselves by their own effort, with the musket and the law, love, and love only, virile peoples; since the hour of license and of ambition—from which North America may perhaps free itself, through the predominance of the purest part of its blood, or into which its vengeful and sordid masses, the tradition of conquest, and the interest of a clever caudillo might fling it—is not yet so near to the eyes of even the most fearful that there is no time left for the test of pride, continuous and discreet, with which it might be faced and turned aside; since its decorum as a republic places upon North America, before the attentive peoples of the Universe, a restraint that cannot be removed by the puerile provocation or the ostentatious arrogance or the parricidal discord of our America—the urgent duty of our America is to show itself as it is, one in soul and in purpose, swift conqueror of a suffocating past, stained only with the blood of fertilizer that the fight against the ruins tears from the hands, and that of the veins our masters left punctured in us. The disdain of the formidable neighbor, who does not know it, is the greatest danger of our America; and it is urgent, because the day of the visit is near, that the neighbor come to know it, come to know it soon, so that it will not disdain it. Out of ignorance, it might perhaps come to lay greedy hands upon it. Out of respect, once it came to know it, it would take its hands away. One must have faith in the best in man and mistrust the worst in him. One must give the best its chance to reveal itself and prevail over the worst. If not, the worst prevails. The peoples must keep a pillory for whoever goads them to useless hatreds; and another for whoever fails to tell them the truth in time.\n\nThere is no hatred of races, because there are no races. The sickly thinkers, the lamp-light thinkers, thread together and reheat the bookshelf races, which the just traveler and the cordial observer seek in vain in the justice of Nature, where there stands out, in victorious love and in turbulent appetite, the universal identity of man. The soul, equal and eternal, emanates from bodies diverse in form and in color. He sins against Humanity who fosters and spreads the opposition and the hatred of races. But within the kneading of peoples there condense, in the nearness of other diverse peoples, peculiar and active characters, of ideas and of habits, of expansion and of acquisition, of vanity and of avarice, which, from the latent state of national preoccupations, could, in a period of internal disorder or of the acceleration of the country's accumulated character, turn into a grave menace for the neighboring lands, isolated and weak, which the strong country declares to be perishable and inferior. To think is to serve. Nor must one suppose, out of village antipathy, an innate and fatal wickedness in the fair-haired people of the continent, because it does not speak our language, nor see the house as we see it, nor resemble us in its political blemishes, which are different from ours, nor hold in high regard the choleric, swarthy men, nor look charitably, from its still ill-secured eminence, upon those who, with less favor from History, climb by heroic stages the road of the republics: nor must the plain facts of the problem be hidden—a problem that can be solved, for the peace of the centuries, by timely study and by the tacit and urgent union of the continental soul. For already the anthem rings out in unison; the present generation carries on its back, along the road fertilized by the sublime fathers, the laboring America; from the Bravo to Magellan, seated on the back of the condor, the Great Semí scattered, over the romantic nations of the continent and over the suffering islands of the sea, the seed of the new America!"}, {"t": "My Race", "b": "José Martí — Patria, 1893", "x": "\"Racist\" is becoming a confused word, and it must be set right. No man has any special right because he belongs to one race or another: say \"man,\" and you have already said all his rights. The black man, for being black, is neither inferior nor superior to any other man; the white man who says \"My race\" sins by redundancy; the black man who says \"My race\" sins by redundancy. Everything that divides men, everything that classifies, separates, or pens them in, is a sin against humanity. What sensible white man imagines he should preen himself on being white, and what do black men think of the white man who preens himself on being so and believes he holds special rights for being so? What must white men think of the black man who takes pride in his color? To insist on the divisions of race, on the differences of race, in a people naturally divided, is to obstruct both public and individual happiness, which lie in the greater drawing together of the elements that must live in common. If it is said that in the black man there is no original sin nor any taint that disables him from unfolding the whole of his soul as a man, the truth is being spoken, and it must be spoken and demonstrated, for the injustice of this world is great, and great is the ignorance that passes for wisdom, and there are still those who in good faith believe the black man incapable of the intelligence and heart of the white man; and if this defense of nature is called racism, it does not matter that it be called so, for it is nothing more than natural decency and a voice that cries out from the breast of man for the peace and the life of the country. If the enslaved race moves away from the condition of slavery, this does not accuse it of inferiority, since the white Gauls, with blue eyes and golden hair, were sold as serfs, with the iron collar about their necks, in the markets of Rome; that is good racism, because it is pure justice and helps to strip the ignorant white man of his prejudices. But there just racism ends, which is the black man's right to maintain and to prove that his color does not deprive him of any of the capacities and rights of the human species.\n\nThe white racist, who credits his race with superior rights, what right has he to complain of the black racist who likewise sees a distinction in his own race? The black racist, who sees in race a special character, what right has he to complain of the white racist? The white man who, by reason of his race, believes himself superior to the black man, admits the idea of race and so authorizes and provokes the black racist. The black man who proclaims his race—when what he perhaps proclaims, uniquely, in this mistaken form, is the spiritual identity of all races—authorizes and provokes the white racist. Peace demands the rights common to nature; differential rights, contrary to nature, are the enemies of peace. The white man who isolates himself isolates the black man. The black man who isolates himself provokes the white man to isolate himself.\n\nIn Cuba there is no fear of a war of races. Man is more than white, more than mulatto, more than black. On the fields of battle the souls of white men and of black men have died together for Cuba, have risen together through the air. In the daily life of defense, of loyalty, of brotherhood, of shrewdness, beside every white man there was always a black man. Black men, like white men, are divided by their characters, timid or valiant, self-denying or selfish, into the various parties in which men gather. Political parties are aggregates of concerns, of aspirations, of interests, and of characters. The essential likeness seeks and finds itself above the differences of detail; and what is fundamental in analogous characters fuses within the parties, even though they differ in what is incidental or subordinate to the common aim. But in sum, the likeness of characters—superior as a factor of union to the internal relations of one color of men, graded and at times opposed within its own gradation—decides and reigns in the formation of parties. The affinity of characters is more powerful among men than the affinity of color. Black men, distributed among the diverse or hostile specialties of the human spirit, will never be able to league themselves, nor will they wish to league themselves, against the white man, distributed among those same specialties. Black men are too weary of slavery to enter voluntarily into the slavery of color. Men of pomp and self-interest will go to one side, white or black; and generous and disinterested men will go to the other. True men, black or white, will deal with one another in loyalty and tenderness, for the pleasure of merit and the pride in all that honors the land where we were born, black or white. The word \"racist\" will fall from the lips of the black men who use it today in good faith, when they understand that it is the only argument of seeming validity, and of real force among sincere and easily frightened men, for denying the black man the fullness of his rights as a man. Two racists would be equally guilty: the white racist and the black racist. Many white men have already forgotten their color, and many black men too. Together they work, white men and black men, for the cultivation of the mind, for the propagation of virtue, for the triumph of creative labor and of sublime charity.\n\nIn Cuba there is never a war of races. The Republic cannot turn back; and the Republic, from the single day of the black man's redemption in Cuba, from the first constitution of independence on the tenth of April at Guáimaro, never spoke of white men or of black men. The public rights, already granted out of pure shrewdness by the Spanish Government and established in custom before the independence of the Island, can no longer be denied, neither by the Spaniard, who will uphold them as long as he draws breath in Cuba in order to go on dividing the black Cuban from the white Cuban, nor by independence, which could not deny in freedom the rights that the Spaniard acknowledged in servitude.\n\nAnd for the rest, each man shall be free in the sanctuary of his home. Merit, the plain and continuous proof of culture, and inexorable commerce will at last unite men. In Cuba there is much greatness in black men and white men alike."}, {"t": "A Vindication of Cuba", "b": "José Martí — The Evening Post, New York, March 25, 1889", "x": "New York, March 21, 1889\n\nTo the Editor of The Evening Post\n\nSir: I beg you to allow me to refer, in your columns, to the offensive slur upon the Cubans published in The Manufacturer of Philadelphia, and reproduced with approval in your issue of yesterday.\n\nThis is not the moment to discuss the question of the annexation of Cuba. It is probable that no Cuban who holds his dignity in any esteem would wish to see his country joined to another whose leaders of opinion share, regarding it, the prejudices that are excusable only in a swaggering politics or in disorderly ignorance. No honorable Cuban will so humble himself as to be received, for the mere worth of his land, as a moral pariah into a nation that denies his capacity, insults his virtue, and scorns his character. There are Cubans who, from respectable motives—from an ardent admiration for progress and liberty, from a foreboding of their own strength under better political conditions, from an unhappy ignorance of the history and tendency of annexation—would wish to see the Island bound to the United States. But those who have fought in the war and have learned in exile; those who have built, with the labor of hand and mind, a virtuous home in the heart of a hostile people; those whose recognized merit as scientists and merchants, as managers and engineers, as teachers, lawyers, artists, journalists, orators, and poets, as men of quick intelligence and uncommon energy, has earned them honor wherever there has been occasion to display their qualities and justice enough to understand them; those who, with their less prepared elements, founded a city of workingmen where the United States had before but a few shanties on a deserted islet—these, more numerous than the others, do not desire the annexation of Cuba to the United States. They do not need it. They admire this nation, the greatest ever raised by liberty; but they distrust the baneful elements that, like worms in the blood, have begun in this prodigious Republic their work of destruction. They have made the heroes of this country their own heroes, and they long for the definitive success of the North American Union as the highest glory of mankind; but they cannot honestly believe that an excessive individualism, the worship of wealth, and the prolonged exultation of a terrible victory are preparing the United States to be the typical nation of liberty, where there shall be no opinion grounded in an immoderate appetite for power, nor any acquisition or triumph contrary to goodness and justice. We love the homeland of Lincoln as much as we fear the homeland of Cutting.\n\nWe Cubans are not that nation of wretched vagabonds or immoral pygmies that The Manufacturer is pleased to describe; nor the country of useless praters, incapable of action, enemies of hard work, that, together with the other peoples of Spanish America, arrogant travelers and writers are wont to paint. We have suffered impatiently under tyranny; we have fought like men, and sometimes like giants, to be free; we are passing through that period of turbulent repose, full of the seeds of revolt, that naturally follows a period of excessive and unfortunate action; we have to struggle, as the vanquished, against an oppressor who deprives us of the means of living and who favors—in the beautiful capital the foreigner visits, and in the interior of the country, where the prey escapes his clutch—the reign of a corruption so great that it comes to poison in our blood the strength we need to conquer liberty. In the hour of our misfortune we deserve the respect of those who did not help us when we sought to shake it off.\n\nBut because our government has systematically permitted, since the war, the triumph of criminals, the occupation of the city by the dregs of the people, the ostentation of ill-gotten riches by a myriad of Spanish officeholders and their Cuban accomplices, the conversion of the capital into a house of immorality, where the philosopher and the hero live without bread beside the magnificent thief from the mother country; because the honest countryman, ruined by a war that seems in vain, returns in silence to the plow that in its hour he knew how to exchange for the machete; because thousands of exiles, availing themselves of a season of calm that no human power can hasten until it burns itself out, are practicing, in the battle of life among free peoples, the art of governing themselves and of building a nation; because our men of mixed blood and our city youths are generally of delicate frame, voluble and courteous, hiding beneath the glove that polishes the verse the hand that fells the enemy—are we to be called, as The Manufacturer calls us, an effeminate people? Those city youths and men of mixed blood, slight of body, knew how to rise in a single day against a cruel government; to pay their passage to the seat of war with the proceeds of their watch and their trinkets; to live by their labor while the land of the free held back their ships in the interest of the enemies of liberty; to obey as soldiers, to sleep in the mud, to eat roots, to fight ten years without pay, to vanquish the enemy with the branch of a tree, to die—these men of eighteen, these heirs of powerful houses, these olive-skinned lads—a death of which no one should speak but with his head uncovered; they died as those other men of ours die who know how, with a stroke of the machete, to send a head flying, or, with a turn of the hand, to bring a bull to its knees. These effeminate Cubans once had courage enough to wear, for a week, upon their arm, face to face with a despotic government, the mourning for Lincoln.\n\nThe Cubans, says The Manufacturer, have \"an aversion to all effort,\" \"do not know how to shift for themselves,\" \"are lazy.\" These \"lazy\" men who \"do not know how to shift for themselves\" came here twenty years ago with empty hands, save for a few exceptions; they struggled against the climate; they mastered the foreign tongue; they lived by their honest labor, some in ease, a few in wealth, rarely in want; they bought or built their homes; they created families and fortunes; they loved luxury, and worked for it; they were not often to be seen in the dark byways of life: independent, and sufficient unto themselves, they feared competition neither in aptitude nor in energy: thousands have gone back to die in their homes: thousands remain where, through the hardships of life, they have ended by triumphing, without the help of a friendly language, a common religion, or the sympathy of race. A handful of Cuban workingmen raised up Key West. The Cubans have distinguished themselves in Panama by their merit as artisans in the noblest trades, as employees, physicians, and contractors. A Cuban, Cisneros, has contributed powerfully to the advancement of the railroads and river navigation of Colombia. Márquez, another Cuban, won, like many of his countrymen, the respect of Peru as an eminent merchant. Everywhere the Cubans are living, working as farmers, as engineers, as surveyors, as artisans, as teachers, as journalists. In Philadelphia, The Manufacturer has daily occasion to see a hundred Cubans, some of them of heroic history and vigorous body, who live by their labor in comfortable abundance. In New York the Cubans are directors in prominent banks, prosperous merchants, well-known brokers, clerks of notable talent, physicians with a native clientele, engineers of worldwide reputation, electricians, journalists, owners of establishments, artisans. The poet of Niagara is a Cuban, our Heredia. A Cuban, Menocal, is chief of the engineers of the Nicaragua canal. In Philadelphia itself, as in New York, the first prize of the Universities has been, more than once, a Cuban's. And the women of these \"lazy\" men, who \"do not know how to shift for themselves,\" these enemies of \"all effort,\" came here, fresh from a sumptuous existence, in the harshest depth of winter: their husbands were at the war, ruined, imprisoned, dead: the \"lady\" set to work: the mistress of slaves became a slave; she sat down behind a counter; she sang in the churches; she stitched buttonholes by the hundred; she sewed for hire; she curled the feathers of milliners; she gave her heart to duty; she withered her body with toil: this is the people \"deficient in morality\"!\n\nWe are \"unfitted by nature and experience to fulfill the obligations of citizenship in a great and free country.\" This cannot in justice be said of a people that possesses—together with the energy that built the first railroad in the Spanish dominions and set up, against a tyrannical government, all the resources of civilization—a truly remarkable knowledge of the body politic, a demonstrated aptitude to adapt itself to its higher forms, and the power, rare in the lands of the tropics, of strengthening its thought and pruning its language. The passion for liberty, the serious study of its best teachings, the development of individual character in exile and in its own country, the lessons of ten years of war and of its manifold consequences, and the practical exercise of the duties of citizenship among the free peoples of the world have contributed, in spite of all hostile antecedents, to develop in the Cuban an aptitude for free government so natural in him that he established it, even to excess of practices, in the midst of the war, struggled with his elders in the zeal to see the laws of liberty respected, and wrenched the sword, without deference or fear, from the hands of all the military pretenders, however glorious they might be. It would seem that there is in the Cuban mind a happy faculty of uniting sense to passion, and moderation to exuberance. Since the beginning of the century, noble teachers have devoted themselves to explaining by their word, and practicing in their lives, the self-denial and tolerance inseparable from liberty. Those who ten years ago won by singular merit the foremost places in the European Universities have been hailed, on their appearance in the Spanish Parliament, as men of sober thought and powerful eloquence. The political knowledge of the common Cuban compares without disadvantage with that of the common citizen of the United States. The absolute absence of religious intolerance, the love of the man for the property acquired by the labor of his hands, and the familiarity, in practice and in theory, with the laws and procedures of liberty, will fit the Cuban to rebuild his country upon the ruins in which he will receive it from his oppressors. It is not to be expected, for the honor of the human race, that the nation that had liberty for its cradle, and received during three centuries the best blood of free men, should employ the power thus amassed to deprive of their liberty a less fortunate neighbor.\n\nThe Manufacturer ends by saying \"that our lack of manly vigor and self-respect is shown by the apathy with which we have so long submitted to Spanish oppression,\" and that \"our very attempts at rebellion have been so pitifully ineffective that they rise little above the dignity of a farce.\" Never was greater ignorance of history and of character displayed than in this most frivolous assertion. It must be remembered, so as not to answer it with bitterness, that more than one American shed his blood at our side in a war that another American was to call \"a farce.\" A farce, the war that has been likened by foreign observers to an epic—the rising of a whole people, the voluntary abandonment of wealth, the abolition of slavery in our first moment of liberty, the burning of our cities with our own hands, the creation of towns and factories in the virgin forests, the clothing of our women with the fabrics of the trees, the holding at bay, through ten years of such a life, of a powerful adversary who lost two hundred thousand men at the hands of a small army of patriots, with no help but that of nature! We had no Hessians and no Frenchmen, no Lafayette or Steuben, no rivalries of kings to aid us: we had but a neighbor who \"extended the limits of his power, and acted against the will of the people,\" to favor the enemies of those who were fighting for the same charter of liberty upon which he founded his independence: we fell victims to the very passions that would have caused the fall of the Thirteen States, had not success united them, while delay weakened us—delay caused not by cowardice, but by our horror of blood, which in the first months of the struggle allowed the enemy to take an irreparable advantage, and by a childlike confidence in the certain aid of the United States: \"They will not see us die for liberty at their own doors without raising a hand or saying a word to give a new free people to the world!\" They \"extended the limits of their power,\" in deference to Spain. They did not raise the hand. They did not say the word.\n\nThe struggle has not ceased. The exiles do not wish to return. The new generation is worthy of its fathers. Hundreds of men have died, since the war, in the mystery of the prisons. Only with life will the battle for liberty cease among us. And it is the sad truth that our efforts would, in all probability, have been renewed with success, had it not been, in some of us, for the unmanly hope of the annexationists of obtaining liberty without paying its price, and for the just fear of others that our dead, our sacred memories, our ruins soaked in blood, should come to be no more than the manure of the soil for the growth of a foreign plant, or the occasion of a jeer for The Manufacturer of Philadelphia.\n\nI am, Sir, your attentive servant,\n\nJosé Martí\nNew York, March 21, 1889\n120 Front Street"}, {"t": "The Future Slavery", "b": "José Martí — La América, New York, 1884", "x": "New York, April 1884\n\nThe tendency toward socialism of present-day governments. –The excessive action of the State. –Dwellings for the poor. –The nationalization of the land. –Officialdom.\n\n\"The Coming Slavery\" is the name of this treatise by Herbert Spencer. That future slavery, which Spencer studies in the manner of a Greek citizen who reckoned the common people as counting for little, is socialism. English literature still carries itself high, as though dressed in the robes of a lord; and this disdain and lordliness, which lend it originality and character, deprive it in turn of that more desirable universal influence to which, by the depth of its thought and the melody of its form, it would have a right. He who does not take communion at the altar of men is justly unknown by them.\n\nHow is socialism to come about, and how is it to become a new slavery? Spencer judges as mounting victories of the socialist idea, and as feeble concessions by the seekers of popularity, that most noble tendency—born precisely to make socialism unnecessary—which springs from all those generous thinkers who see how the just discontent of the lower classes leads them to desire radical and violent improvements, and who find no more natural way of curing the harm at its root than to remove the motive for discontent. But this must be done in such a way that the relief of the poor is not turned into the fostering of idlers; and it is to this that the laws dealing with relief must be directed, rather than to leaving the humble folk with all their reasons for revolt intact.\n\nUnder the pretext of succoring the poor—says Spencer—so many levies are exacted that those who are not poor are turned into poor. The law that established parish relief for the poor made the number of poor greater. The law that created a certain bounty for the mothers of illegitimate children was the cause that men preferred such women for wives over honest young girls, because the former brought the bounty as a dowry. If the poor grow accustomed to asking everything of the State, they will soon cease to make any effort toward their own subsistence, unless they are smoothed along by the State's providing them with work. The poor are already aided in a thousand forms. Now it is wished that the government should build them edifices. It is demanded that, just as the government owns the telegraph and the post, it should own the railroads. On the day the State becomes a builder, Spencer believes that, since builders will draw less profit from houses, they will not build, and the State will come to be the sole builder—an argument which, although it comes from a formidable reasoner, does not stand well upon its feet. And on the day the State becomes owner of the railroads, it will usurp all the industries connected with them and enter into rivalry with the whole diverse multitude of manufacturers—a line of reasoning which, no less than the other, totters, because railroad enterprises are few and very scarce that themselves fashion the materials they use. And all these interventions of the State Herbert Spencer judges to be caused by the rising tide and imposed by the rabble that demands them, as if the most praiseworthy and sensible desire to give the poor clean housing—which heals body and mind alike—had not been born in the very ranks of cultured people, without the unworthy idea of courting popular favor; and as if that other attempt to give the railroads over to the State did not have, along with various drawbacks, high moralizing aims, such as that of gradually doing away with the corrupting games of the stock exchange, and were not nourished in several countries at one and the same time, among people who certainly do not frequent taverns or hovels.\n\nSpencer fears, not without foundation, that when the action of the State comes to be so varied, active, and dominant, the State would have to impose considerable burdens upon the working portion of the nation for the benefit of the pauper portion. And it is true that if benevolence were to reach such a point that the paupers no longer needed to work in order to live—which they will never be able to reach—individual action would gradually weaken, and the condition of those who hold some wealth would grow heavier, without this being enough to quiet the needs and appetites of those who have none. He fears, moreover, the accumulation of additional and ever more extensive laws that the regulation of the earlier pauper laws brings about; but this comes from the wish to legislate the forms of the evil, and to cure it in its manifestations, when what it must be cured of is at its base—which lies in the miring, the wormrot, and the putrefaction in which the lower classes of the great cities live; and from whose misery—at a cost that would certainly not drive from the market the builders of houses of richer style, and without the risks Spencer exaggerates—they may doubtless be greatly helped out by the clean, artistic, luminous, and airy houses that it is rightly proposed to give to the workers; for the human spirit has a natural tendency toward goodness and culture, and in the presence of what is lofty, it rises, and in the presence of what is clean, it cleans itself. Besides, by giving cheap houses to the poor, the only aim is to give them good dwellings at the same price they pay today for infected shanties.\n\nSet upon these fixed bases—to which the exaggerated demands of the radicals and of the Democratic Federation lend a certain greater solidity in English politics—Spencer constructs the edifice to come, truly dark, and resembling that of the Peruvians before the conquest and that of Gaul in the decadence of Rome, in which epochs the citizen received everything from the State, in compensation for the work the citizen did for the State.\n\nHenry George goes about preaching the justice of having the land pass into the ownership of the nation; and the Democratic Federation yearns for the formation of \"industrial and agricultural armies led by the State.\" By burdening with more levies, in order to meet the new demands, the lands of low yield, the yield of these will come to be null, and the nation—to which in the end everything comes from the land—will have fewer fruits, and it will become necessary for the State to organize compulsory cultivation. Such enterprises would increase in terrible fashion the number of public employees, already excessive. With each new function would come a new caste of functionaries. Already in England, as almost everywhere, there is too great a fondness for occupying public posts, held to be more distinguished than any others, and in which an ample and certain remuneration is obtained for relatively scant work; whereby it is clear that the national nerve is lost. Ill fares a nation of office-holders!\n\nAll the power that the caste of functionaries would go on acquiring, bound together by the need to maintain themselves in a privileged and lucrative occupation, the people would go on losing—a people that does not have the same reasons of complicity in hopes and gains with which to confront the functionaries linked by common interests. As all public needs would come to be satisfied by the State, the functionaries would then acquire the enormous influence that naturally comes to those who distribute some right or benefit. The man who now wants the State to take care of him so that he need not take care of himself would then have to work in the measure, for the time, and in the labor that it pleased the State to assign him, since to the State—upon which all duties would fall—would naturally be given all the faculties necessary to secure the means of fulfilling them. From being the servant of himself, man would pass to being the servant of the State. From being the slave of the capitalists, as it is now called, he would go on to being the slave of the functionaries. A slave is anyone who works for another who has dominion over him; and in that socialist system the community would dominate the man, who would hand over all his labor to the community. And since functionaries are human beings, and therefore abusers, arrogant, and ambitious, and in that organization they would hold great power—supported by all those who profited or hoped to profit from the abuses, and by those vile forces which the terror, the prestige, or the cunning of those who command always purchases among the oppressed—this system of official distribution of the common labor would come in a short time to suffer the breakdowns, violences, thefts, and distortions that the spirit of individuality, the authority and boldness of genius, and the wiles of vice promptly and fatally originate in every human organization. \"Out of bad humanity\"—says Spencer—\"good institutions cannot be made.\" Public misery will therefore be, under such socialism as everything in England seems to tend toward, palpable and great. Autocratic officialdom will abuse the weary and toiling plebs. Lamentable, and general, will be the servitude.\n\nAnd throughout this whole study Herbert Spencer notes the possible consequences of the accumulation of functions in the State, which would end in that painful and degraded slavery; but he does not point out with equal energy, as he casts in the paupers' faces their abandonment and ignominy, the natural ways of balancing the public wealth so inhumanly divided in England—a wealth that must naturally keep in wrath, disconsolation, and despair those human beings who gnaw their fists with hunger in the very streets along which other human beings stroll, sullen and erect, who with the income of a single year of their properties could cover all England in guineas.\n\nWe would say to politics: Err, but console! For he who consoles never errs."}, {"t": "Karl Marx", "b": "José Martí — La Nación, Buenos Aires, 1883", "x": "Behold this great hall. Karl Marx is dead. Because he took the side of the weak, he deserves honor. But the man who does good is not the one who points out the harm and burns with generous longing to remedy it; it is the one who teaches a gentle remedy for the harm. The task of hurling men upon men is a fearsome one. The forced brutalizing of some men for the profit of others fills us with indignation. Yet a way out must be found for that indignation, so that the beast may cease without bursting its bounds and spreading terror. Behold this hall: presiding over it, wreathed in green leaves, hangs the portrait of that ardent reformer, that gatherer of men from diverse peoples, that tireless and vigorous organizer. The International was his work: men of all nations come to do him honor. The crowd, made up of brave laborers whose sight softens and comforts the heart, shows more muscles than jewels and more honest faces than silken cloth. Work beautifies. It renews one to look upon a farmhand, a blacksmith, or a sailor. From handling the forces of nature, they come to be as beautiful as those forces themselves.\n\nNew York is becoming a kind of maelstrom: whatever seethes in the world falls into it. Here it smiles upon the one who flees; elsewhere, they make him flee. From this kindness has come to this people its strength. Karl Marx studied the ways to set the world upon new foundations, and he awoke the sleeping, and he showed them how to cast down the broken props. But he went in haste, and somewhat in shadow, failing to see that children not born of a natural, laborious gestation do not come into the world viable, neither from the womb of a people in history, nor from the womb of a woman in the home. Here are good friends of Karl Marx, who was not only a titanic mover of the wrath of Europe's workers, but a profound seer into the reason of human miseries and into the destinies of men, and a man consumed by the longing to do good. He saw in all things what he carried within himself: rebellion, an upward road, struggle.\n\nHere is a Lecovitch, a man of the newspapers: see how he speaks; there reach him reflections of that tender and radiant Bakunin; he begins to speak in English; he turns to others in German; \"da! da!\" his countrymen answer with enthusiasm from their seats when he speaks to them in Russian. The Russians are the whip of reform: but no—these impatient and generous men, stained with anger, are not yet the ones who are to lay the foundation of the new world: they are the spur, and they come at the right moment, like the voice of conscience, which might otherwise fall asleep; but the steel of the goad does not serve well as a founder's hammer. Here is Swinton, an old man whom injustices inflame, and who saw in Karl Marx the stature of a mountain and the light of Socrates. Here is the German John Most, an insistent and none-too-amiable crier, a kindler of bonfires, who does not carry in his right hand the balm with which to heal the wounds his left hand opens. So many people have gone to hear them speak that the hall overflows and spills into the street. Choral societies sing. Among so many men there are many women. In chorus, with applause, they repeat phrases of Karl Marx that hang on placards along the walls. Millot, a Frenchman, says a beautiful thing: \"Liberty has fallen in France many times: but it has risen more beautiful from each fall.\" John Most speaks fanatical words: \"Since I read the books of Marx in a Saxon prison, I have taken up the sword against the human vampires.\" A certain Magure says: \"It rejoices the heart to see together, now without hatreds, so many men of all peoples. All the workers of the earth already belong to a single nation, and they do not quarrel among themselves, but all together against those who oppress them. It rejoices the heart to have seen, near what was in Paris the ominous Bastille, six thousand workers gathered from France and from England.\" A Bohemian speaks. They read a letter from Henry George, that famous new economist, friend of those who suffer, beloved by the people, and famous both here and in England. And amid salvos of thundering applause and frenzied hurrahs, the ardent assembly rises to its feet in one unanimous movement, while from the platform two men of broad brow and gaze like a Toledo blade read, in German and in English, the resolutions with which the great gathering concludes, wherein Karl Marx is called the noblest hero and the most powerful thinker of the world of labor. Music sounds; choruses resound—but one notices that they are not the choruses of peace."}, {"t": "The Brooklyn Bridge", "b": "José Martí — La América, New York, 1883", "x": "In these days the blood throbs more generously in the veins of the astonished and joyful New Yorkers: it seems that a crown has fallen upon the city, and that each inhabitant feels it set upon his own head; there flows into the avenues, along the way to the bank of the East River, an eager throng that moves with the step of one going to behold a marvel—and the reason is that in stone and steel there now rises what was once a slender line at the tip of a bold builder's pencil; and after fifteen years of labor, Brooklyn and New York are at last joined by a suspension bridge of 3,455 feet.\n\nOn June 7, 1870, they began to clear the space in which the Brooklyn tower was to be raised to sustain the mighty fabric; on May 24, 1883, firmly strung between its two towers—which look like slimmed-down Egyptian pyramids—this bridge of five broad roadways was opened to the public, and along it today, crowded and panting, a hundred thousand men hurl themselves from dawn to midnight. Seeing that multitude swarm and scurry swiftly over the airy serpent—so dense, so vast, so clean, forever growing—one imagines one sees, seated in the middle of the sky, her head radiant and piercing its summit, and with her white hands, great as eagles, spread wide in a sign of peace over the earth: Liberty, who in this city has borne such a daughter. Liberty is the mother of the new world—which is dawning. And it seems as though her sun were rising above these two towers.\n\nWe take the readers of *La América* by the hand, and bring them to see at close quarters—on its surface, which stands out cleanly against the sky; in its foundations, which bite into the rock at the bottom of the river; in its entrails, which guard and shelter from time and wear immense masses on one bank and the other—this suspension bridge of Brooklyn, between whose lofty walls of wire cords, hung—as though from the tusk of a mammoth that might with a single thrust have unhinged a mountain—from four long, parallel, cyclopean cables, there press together today, as between neighboring crags from top to bottom in the heart of a mountain: Hebrews of sharp profile and avid eyes, jovial Irishmen, fleshy and sturdy Germans, rosy and robust Scots, handsome Hungarians, sumptuous Blacks, Russians with eyes that burn, red-haired Norwegians, elegant Japanese, and lean, indifferent Chinese. The Chinese is the wretched son of the ancient world—for so does despotism crush men: like worms in a vat, its serfs wallow among the vices. The children of despotic societies seem like statues carved in mud. Their lives are not censers of incense—but the foul smoke of opium.\n\nAnd the creators of this bridge, and those who maintain it, and those who cross it, seem—save for the excessive love of wealth that gnaws like a worm at their mighty core—men hewn from granite, like the bridge. There goes the structure! It springs up on the New York side, from beneath a solemn mass that bears down upon its root with the weight of 120,000,000 pounds; it issues from its formidable socket at a distance of 930 feet from the tower, out into the open air; it passes, hung from the cables that droop above the towers 276⅓ feet high, through the midst of these Pelasgic towers—which, where the bridge crosses, measure 118 feet above the level of high tide; it climbs to the middle of its course, to meet, at 135 feet of elevation above the river, the cables that descend in a solemn and graceful curve from the top of the tower; it descends, while the cable rises again to the top of the Brooklyn tower, to the foot of the tower's arches, where this one, like that of New York, reaches 118 feet; and it re-enters, sliding across the air with all its formidable lacework, into the Brooklyn socket, which, with a mass of stone equal to that of New York, its breast gashed by noble and deep arches, holds fast the other root of the cable. And when, upon their four steel plates, buried beneath each of the anchoring masses, the four cables from which the bridge hangs come to their end, they have spanned, from one shore of the East River to the other, 3,578 feet. Oh, clasp worthy of these two wondrous cities! Oh, hyphen of iron—between these two words of the New Gospel!\n\nLet us knock at the doors of the New York station. Thousands of men, crowded at the central door, bar our way. Rising above the multitude, capped with their humble blue caps, are the eminent heads of the city policemen, who put the mob in order. To our right, along the carriage road, there enter carts bearing pieces of walls and columns; red mail-wagons, stuffed with letters; meager little carts of milk cans; sumptuous coaches, full of rich ladies; coarse lads riding bareback, amid heaps of harness, upon draft horses that yield little to the Trojan one; and comely youths who flit about the coaches on nervous steeds. Now the throng gives way: we leave upon the counter of the entrance booth a cent, which is the price of passage; from the New York station the colossal towers can scarcely be seen; over our heads, pounding on the rails of the as-yet-unfinished railway station that is to cross the bridge, ponderous hammers hum; pushed along by the multitude, we hurriedly ascend the anchoring structure on this side of the bridge. Before us open five roadways, begun upon the robust masonry: the two at the edges are for horses and carriages; the two inner ones adjoining them, between which rises the walkway for pedestrians, are those of the railway's coming and going, whose ample cars rest at the entrance; at about 700 feet the masonry ceases, and the suspension bridge begins, held up by the four parallel cables, bound to the iron links that, like an immense curved cutlass with its point upon the earth, pass through the masonry as though it had its handle at the river and its tip at the city, until they anchor at the bottom of the structure. The floor is no longer of stone, but of wood, beneath whose joints one sees pass, like swift errand-runners and lesser monsters, the trains of the elevated railway, which run the length of this bank of the river—to right and to left. And beneath our feet, all is weave, net, lace of steel; the steel bars interlace in the pavement and in the walls that divide its five broad roadways, with the grace, lightness, and slenderness of threads; before us there rise up, like a curtain of invisible cloth furrowed by long white bands, the four walls of stays that hang from the four curved cables. The two mighty arches, opened in the upper part of the tower, seem like the gates of a grandiose world that gladdens the spirit; one feels, in the presence of that gigantic buttress, submissions of gratitude, counsels of majesty, and as though within our mind, religiously moved, summits were rising. The pedestrians' path, now beneath the tower, opens at the foot of the wall that divides the two arches; it girds it in a square; it joins again, amid the colossal wirework that, in paired lanes, hung from the four thick cables, descends in long braids—tall as the spires of a Gothic church near the tower, shorter as the curve drops toward the center of the bridge; and at last, in the center, level with it. And the bridge—raised at its midpoint to 135 feet, so that beneath it the tallest ships may pass without blunting their masts or tangling their pennants—begins to descend, in the very degree in which its first half ascends: the imposing cordage, which before came down, now in a reversed curve climbs to the top of the second tower; the path, at the foot of this one, reopens in a square, as at the foot of the New York tower, and draws itself in: beneath its steel plates steamships whistle, chimneys smoke, the multitudes that come and go in the aged little steamers overflow, barges are unloaded, ships are moored: the steel roadway, laden with people, enters at last upon the masonry one that carries on its back the Brooklyn anchoring structure, which, upon its arcades that look like hollow mountains, spreads, curves, serves as a roof to the thoroughfare streets—resembling, beneath them, gigantic tunnels—and pours out at last, into another iron station, to scatter, seething and bustling through the streets, the throng that had come pushing us along from New York, amid clamor, wonder, jests, high spirits, and songs. The immense brings joy.\n\nBut there always remain before one's eyes, like sappers of the Universe to come, opening the road for the men who advance, those four colossal boas, those four parallel cables, thick and white, which, like serpents in the hour of appetite, uncoil and raise their hissing bodies on one side of the river, rise to a heroic height, stretch over sovereign pillars above the water, and go to fall on the opposite side. And it seems as though one's feet were left treading upon that framework which from afar resembles a subtle surface, and like the tongue of a monstrous anthill; and which from close up is a most tightly woven warp that entrusts its support only to the cables, and to the steel cords that, in the form of a fan, come down in four walls, crossing with those of the vertical stays on each of the sides of the towers. And they sway, in the manner of sated boas—upon the concave plate on which, in the aperture where they pass through the top of the towers, they rest upon wheels—the four great cables, like the wires of a mighty lyre, worthy at last of men, which now begins to intone its songs!\n\nBut how did those magic cables come to be anchored to the earth? How did those slender towers rise from the waters, with their mantle of steel braids? How was the stout framework fastened, over which there now pass all at once—as over a roadway cut into rock—five thousand men, and locomotives, and carriages, and carts? How are they raised into the air, barely murmuring, like reeds in the wind, those fabrics that weigh 8,120 tons? And the cables—how, if they weigh so much of themselves, do they sustain the rest of that prodigious burden?\n\nWell, those cables, like a tree by its roots, are held fast in flat anchors, by masses greater than there were in Thebes or in any acropolis; those towers rise upon wooden caissons that were carried bottom-up, with the foundations of the tower on their backs, down to the hard rock, 78 feet below the surface of the water; and those cables do not drag down the corpulent towers with their ponderous cords, but rather, from the apt distribution of their strands and from the resistance—scarcely calculable—that comes to them from their moorings, they bear up the hanging structure, and whatever the traffic of centuries, with its feverish breath, may cast upon it.\n\nAnd what root could have made fast to earth that giant framework, the amazement of the eyes and the mockery of the air? What needle could have sewn in orderly fashion those steel threads, 15¼ inches in diameter, and knotted them at the ends? Who strung, from tower to tower, over 1,596 feet of width, the first thread—5,000 threads—14,000 miles of thread? Who drew the water out of its dominions, and rode upon the air, and gave man wings?\n\nLet the readers of *La América* lift their eyes to the great anchoring structures that crown the bridge on one side and the other. They are walls that would bar the passage of the Nile, of hard white stone, which rise 90 feet above high tide: they are walls almost cubic, which measure 119 feet across the front and 132 at the side, and with their enormous weight they bear down upon these that we shall now see—four chains that hold fast, with 36 claws each, the four cables. There in the depths, on the farther side away from the river, there lie, finished off with slender teeth—like the body of an octopus with its many arms, or like stars with rays of curving point—four plates of 46,000 pounds of weight each, which have a surface of 16½ feet by 17½, and gather their slender rays into the compact mass of the center, 2½ feet thick, where, through eighteen oblong holes set in two parallel rows of nine, there pass eighteen links; through whose broad eyes of finish, which remain in a double row beneath the plate, there pass most powerful bars, 7 feet long, driven into two semicylindrical grooves cut in the base of the plate. Such, on each side, are the teeth of the bridge. Around the first 18 links, which were left standing like lances of 12½ feet, finished off in an eye instead of a shaft, awaiting soldiers not yet born, they heaped up the blocks of granite, which seemed pieces of a mountain; and as they fastened the links by means of pins that passed at once through all 36 eyes of finish of each 18 contiguous links—braided as the fingers of the hands are braided, and which, left loose, would have turned one upon another, as the two leaves of a hinge turn upon their common axis—they tilted toward the river, in the inner curve of the cutlass, with the placing of the invincible stones, each double row of new links, until, as they drew near the height at which the four cables were to come to interlace with the complicated fourfold skeleton, the double row doubles, the two beds of links are turned into four; the 18 bars are now 36; the two parallel pins, which at diverse and equal intervals—like the rings of a flat serpent that crawls—had come securing the double chain, become four; and each of these pins, great enough to be the mast of a ship or the column of a church, holds fast at once, passing through eighteen eyes, the nine in which end the links of each of the four rows, and nine eyes of nine of the strands of each cable, which has nineteen strands, each of which splits in two at each end to fit—like a wedge between the two portions of the body it breaks—between the eyes of two contiguous links; whereby, by the same four parallel pins, there are joined in four superposed and identical beds the 36 ends of each anchoring chain and the 36 ends of each cable. Those four double marrows of iron, up to 25 feet below the top of the wall that faces the river—at which point the cable already enters the wall—pass through those two monstrous bodies of granite: marrows that an intricate framework of steel sinews then finishes off; for it is a law, which proclaims the One on high, and the eternal in the analogous, that every organism man invents, to subdue or make fruitful the earth, should be arranged in the likeness of man. It is as though in one colossal man all life were to be brought to its summit and gathered together.\n\nOf wood is—of wood, of Georgia pine, which beneath the water neither the oxygen reaches nor the borer gnaws—the support of both towers. *Caisson* they call it in French and in English, and it is a French invention. It is an immense box, turned inside out: the mouth below; the bottom above; and upon the bottom that serves it as a lid, twenty-two feet of pine planks, crossed at right angles, fastened to the roof of the box by screws thick as trees, and twisted and enlarged, as a madman must see his ideas in his kindled brain; and from timber to timber, iron clamps; and in the joints, tar and adhesive, durable matter. Oh, these things that amaze well deserve that we go down the iron-lined shaft—airtight—that descends from the top of the caisson, between the walls of pine, to the hollow caisson, also of iron against air, lined with boiler iron, and whose walls, shod with iron, go on diminishing within, so as to leave greater space for the excavators, from the eight feet with which they begin near the bottom that serves as a roof, to eight inches. Already the corpulent structure floats, with its margin of 11 feet, between the triple palisade that the engineers have built for it in the very place where the tower is to rise; already it begins to sink, under the weight of the first blocks of granite they cast upon its back; already it descends! already it descends! Through the air channels they introduce into the caisson the compressed air, before which the vanquished water flees—not without great struggles, titanic leaps five hundred feet above the shafts, thundering roars, and deadly rebellions. The men who work in that deep cannot even whistle, where the air is compressed to 32 pounds per square inch; nor can they put out a light, which rekindles of itself. From the iron shaft by which the excavators descend to the damp hollow of the caisson
