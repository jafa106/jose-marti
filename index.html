And since functionaries are human beings, and therefore abusers, arrogant, and ambitious, and in that organization they would hold great power—supported by all those who profited or hoped to profit from the abuses, and by those vile forces which the terror, the prestige, or the cunning of those who command always purchases among the oppressed—this system of official"}, {"e": 3, "t": "distribution of the common labor would come in a short time to suffer the breakdowns, violences, thefts, and distortions that the spirit of individuality, the authority and boldness of genius, and the wiles of vice promptly and fatally originate in every human organization. \"Out of bad humanity\"—says Spencer—\"good institutions cannot be made.\" Public misery will therefore be, under such socialism as everything in England seems to tend toward, palpable and great. Autocratic officialdom will abuse the weary and toiling plebs. Lamentable, and general, will be the servitude."}, {"e": 3, "t": "And throughout this whole study Herbert Spencer notes the possible consequences of the accumulation of functions in the State, which would end in that painful and degraded slavery; but he does not point out with equal energy, as he casts in the paupers' faces their abandonment and ignominy, the natural ways of balancing the public wealth so inhumanly divided in England—a wealth that must naturally keep in wrath, disconsolation, and despair those human beings who gnaw their fists with hunger in the very streets along which other human beings stroll, sullen and erect, who with the income of a single year of their properties could cover all England in guineas. We would say to politics: Err, but console! For he who consoles never errs."}, {"e": 4, "t": "Behold this great hall. Karl Marx is dead. Because he took the side of the weak, he deserves honor. But the man who does good is not the one who points out the harm and burns with generous longing to remedy it; it is the one who teaches a gentle remedy for the harm. The task of hurling men upon men is a fearsome one. The forced brutalizing of some men for the profit of others fills us with indignation. Yet a way out must be found for that indignation, so that the beast may cease without bursting its bounds and spreading terror. Behold this hall: presiding over it, wreathed in green leaves, hangs the portrait of that ardent reformer, that gatherer of men from diverse peoples, that tireless and vigorous organizer. The International was his work: men of all nations come to do him honor. The crowd, made up of"}, {"e": 4, "t": "brave laborers whose sight softens and comforts the heart, shows more muscles than jewels and more honest faces than silken cloth. Work beautifies. It renews one to look upon a farmhand, a blacksmith, or a sailor. From handling the forces of nature, they come to be as beautiful as those forces themselves."}, {"e": 4, "t": "New York is becoming a kind of maelstrom: whatever seethes in the world falls into it. Here it smiles upon the one who flees; elsewhere, they make him flee. From this kindness has come to this people its strength. Karl Marx studied the ways to set the world upon new foundations, and he awoke the sleeping, and he showed them how to cast down the broken props. But he went in haste, and somewhat in shadow, failing to see that children not born of a natural, laborious gestation do not come into the world viable, neither from the womb of a people in history, nor from the womb of a woman in the home. Here are good friends of Karl Marx, who was not only a titanic mover of the wrath of Europe's workers, but a profound seer into the reason of human miseries and into the destinies of men, and a man consumed by the"}, {"e": 4, "t": "Here is a Lecovitch, a man of the newspapers: see how he speaks; there reach him reflections of that tender and radiant Bakunin; he begins to speak in English; he turns to others in German; \"da! da!\" his countrymen answer with enthusiasm from their seats when he speaks to them in Russian. The Russians are the whip of reform: but no—these impatient and generous men, stained with anger, are not yet the ones who are to lay the foundation of the new world: they are the spur, and they come at the right moment, like the voice of conscience, which might otherwise fall asleep; but the steel of the goad does not serve well as a founder's hammer. Here is Swinton, an old man whom injustices inflame, and who saw in Karl Marx the stature of a mountain and the light of Socrates. Here is the German John Most, an insistent"}, {"e": 4, "t": "and none-too-amiable crier, a kindler of bonfires, who does not carry in his right hand the balm with which to heal the wounds his left hand opens. So many people have gone to hear them speak that the hall overflows and spills into the street. Choral societies sing. Among so many men there are many women. In chorus, with applause, they repeat phrases of Karl Marx that hang on placards along the walls. Millot, a Frenchman, says a beautiful thing: \"Liberty has fallen in France many times: but it has risen more beautiful from each fall.\" John Most speaks fanatical words: \"Since I read the books of Marx in a Saxon prison, I have taken up the sword against the human vampires.\" A certain Magure says: \"It rejoices the heart to see together, now without hatreds, so many men of all peoples. All the workers of the"}, {"e": 4, "t": "earth already belong to a single nation, and they do not quarrel among themselves, but all together against those who oppress them. It rejoices the heart to have seen, near what was in Paris the ominous Bastille, six thousand workers gathered from France and from England.\" A Bohemian speaks. They read a letter from Henry George, that famous new economist, friend of those who suffer, beloved by the people, and famous both here and in England. And amid salvos of thundering applause and frenzied hurrahs, the ardent assembly rises to its feet in one unanimous movement, while from the platform two men of broad brow and gaze like a Toledo blade read, in German and in English, the resolutions with which the great gathering concludes, wherein Karl Marx is called the noblest hero and the most powerful thinker of the"}, {"e": 5, "t": "In these days the blood throbs more generously in the veins of the astonished and joyful New Yorkers: it seems that a crown has fallen upon the city, and that each inhabitant feels it set upon his own head; there flows into the avenues, along the way to the bank of the East River, an eager throng that moves with the step of one going to behold a marvel—and the reason is that in stone and steel there now rises what was once a slender line at the tip of a bold builder's pencil; and after fifteen years of labor, Brooklyn and New York are at last joined by a suspension bridge of 3,455 feet."}, {"e": 5, "t": "On June 7, 1870, they began to clear the space in which the Brooklyn tower was to be raised to sustain the mighty fabric; on May 24, 1883, firmly strung between its two towers—which look like slimmed-down Egyptian pyramids—this bridge of five broad roadways was opened to the public, and along it today, crowded and panting, a hundred thousand men hurl themselves from dawn to midnight. Seeing that multitude swarm and scurry swiftly over the airy serpent—so dense, so vast, so clean, forever growing—one imagines one sees, seated in the middle of the sky, her head radiant and piercing its summit, and with her white hands, great as eagles, spread wide in a sign of peace over the earth: Liberty, who in this city has borne such a daughter. Liberty is the mother of the new world—which is dawning. And it seems as"}, {"e": 5, "t": "We take the readers of *La América* by the hand, and bring them to see at close quarters—on its surface, which stands out cleanly against the sky; in its foundations, which bite into the rock at the bottom of the river; in its entrails, which guard and shelter from time and wear immense masses on one bank and the other—this suspension bridge of Brooklyn, between whose lofty walls of wire cords, hung—as though from the tusk of a mammoth that might with a single thrust have unhinged a mountain—from four long, parallel, cyclopean cables, there press together today, as between neighboring crags from top to bottom in the heart of a mountain: Hebrews of sharp profile and avid eyes, jovial Irishmen, fleshy and sturdy Germans, rosy and robust Scots, handsome Hungarians, sumptuous Blacks, Russians with eyes that"}, {"e": 5, "t": "burn, red-haired Norwegians, elegant Japanese, and lean, indifferent Chinese. The Chinese is the wretched son of the ancient world—for so does despotism crush men: like worms in a vat, its serfs wallow among the vices. The children of despotic societies seem like statues carved in mud. Their lives are not censers of incense—but the foul smoke of opium."}, {"e": 5, "t": "And the creators of this bridge, and those who maintain it, and those who cross it, seem—save for the excessive love of wealth that gnaws like a worm at their mighty core—men hewn from granite, like the bridge. There goes the structure! It springs up on the New York side, from beneath a solemn mass that bears down upon its root with the weight of 120,000,000 pounds; it issues from its formidable socket at a distance of 930 feet from the tower, out into the open air; it passes, hung from the cables that droop above the towers 276⅓ feet high, through the midst of these Pelasgic towers—which, where the bridge crosses, measure 118 feet above the level of high tide; it climbs to the middle of its course, to meet, at 135 feet of elevation above the river, the cables that descend in a solemn and graceful curve from"}, {"e": 5, "t": "the top of the tower; it descends, while the cable rises again to the top of the Brooklyn tower, to the foot of the tower's arches, where this one, like that of New York, reaches 118 feet; and it re-enters, sliding across the air with all its formidable lacework, into the Brooklyn socket, which, with a mass of stone equal to that of New York, its breast gashed by noble and deep arches, holds fast the other root of the cable. And when, upon their four steel plates, buried beneath each of the anchoring masses, the four cables from which the bridge hangs come to their end, they have spanned, from one shore of the East River to the other, 3,578 feet. Oh, clasp worthy of these two wondrous cities! Oh, hyphen of iron—between these two words of the New Gospel!"}, {"e": 5, "t": "Let us knock at the doors of the New York station. Thousands of men, crowded at the central door, bar our way. Rising above the multitude, capped with their humble blue caps, are the eminent heads of the city policemen, who put the mob in order. To our right, along the carriage road, there enter carts bearing pieces of walls and columns; red mail-wagons, stuffed with letters; meager little carts of milk cans; sumptuous coaches, full of rich ladies; coarse lads riding bareback, amid heaps of harness, upon draft horses that yield little to the Trojan one; and comely youths who flit about the coaches on nervous steeds. Now the throng gives way: we leave upon the counter of the entrance booth a cent, which is the price of passage; from the New York station the colossal towers can scarcely be seen; over our"}, {"e": 5, "t": "heads, pounding on the rails of the as-yet-unfinished railway station that is to cross the bridge, ponderous hammers hum; pushed along by the multitude, we hurriedly ascend the anchoring structure on this side of the bridge. Before us open five roadways, begun upon the robust masonry: the two at the edges are for horses and carriages; the two inner ones adjoining them, between which rises the walkway for pedestrians, are those of the railway's coming and going, whose ample cars rest at the entrance; at about 700 feet the masonry ceases, and the suspension bridge begins, held up by the four parallel cables, bound to the iron links that, like an immense curved cutlass with its point upon the earth, pass through the masonry as though it had its handle at the river and its tip at the city, until they anchor at"}, {"e": 5, "t": "the bottom of the structure. The floor is no longer of stone, but of wood, beneath whose joints one sees pass, like swift errand-runners and lesser monsters, the trains of the elevated railway, which run the length of this bank of the river—to right and to left. And beneath our feet, all is weave, net, lace of steel; the steel bars interlace in the pavement and in the walls that divide its five broad roadways, with the grace, lightness, and slenderness of threads; before us there rise up, like a curtain of invisible cloth furrowed by long white bands, the four walls of stays that hang from the four curved cables. The two mighty arches, opened in the upper part of the tower, seem like the gates of a grandiose world that gladdens the spirit; one feels, in the presence of that gigantic buttress, submissions of"}, {"e": 5, "t": "gratitude, counsels of majesty, and as though within our mind, religiously moved, summits were rising. The pedestrians' path, now beneath the tower, opens at the foot of the wall that divides the two arches; it girds it in a square; it joins again, amid the colossal wirework that, in paired lanes, hung from the four thick cables, descends in long braids—tall as the spires of a Gothic church near the tower, shorter as the curve drops toward the center of the bridge; and at last, in the center, level with it. And the bridge—raised at its midpoint to 135 feet, so that beneath it the tallest ships may pass without blunting their masts or tangling their pennants—begins to descend, in the very degree in which its first half ascends: the imposing cordage, which before came down, now in a reversed curve climbs to"}, {"e": 5, "t": "the top of the second tower; the path, at the foot of this one, reopens in a square, as at the foot of the New York tower, and draws itself in: beneath its steel plates steamships whistle, chimneys smoke, the multitudes that come and go in the aged little steamers overflow, barges are unloaded, ships are moored: the steel roadway, laden with people, enters at last upon the masonry one that carries on its back the Brooklyn anchoring structure, which, upon its arcades that look like hollow mountains, spreads, curves, serves as a roof to the thoroughfare streets—resembling, beneath them, gigantic tunnels—and pours out at last, into another iron station, to scatter, seething and bustling through the streets, the throng that had come pushing us along from New York, amid clamor, wonder, jests, high spirits, and"}, {"e": 5, "t": "But there always remain before one's eyes, like sappers of the Universe to come, opening the road for the men who advance, those four colossal boas, those four parallel cables, thick and white, which, like serpents in the hour of appetite, uncoil and raise their hissing bodies on one side of the river, rise to a heroic height, stretch over sovereign pillars above the water, and go to fall on the opposite side. And it seems as though one's feet were left treading upon that framework which from afar resembles a subtle surface, and like the tongue of a monstrous anthill; and which from close up is a most tightly woven warp that entrusts its support only to the cables, and to the steel cords that, in the form of a fan, come down in four walls, crossing with those of the vertical stays on each of the sides of the"}, {"e": 5, "t": "towers. And they sway, in the manner of sated boas—upon the concave plate on which, in the aperture where they pass through the top of the towers, they rest upon wheels—the four great cables, like the wires of a mighty lyre, worthy at last of men, which now begins to intone its songs!"}, {"e": 5, "t": "But how did those magic cables come to be anchored to the earth? How did those slender towers rise from the waters, with their mantle of steel braids? How was the stout framework fastened, over which there now pass all at once—as over a roadway cut into rock—five thousand men, and locomotives, and carriages, and carts? How are they raised into the air, barely murmuring, like reeds in the wind, those fabrics that weigh 8,120 tons? And the cables—how, if they weigh so much of themselves, do they sustain the rest of that prodigious burden?"}, {"e": 5, "t": "Well, those cables, like a tree by its roots, are held fast in flat anchors, by masses greater than there were in Thebes or in any acropolis; those towers rise upon wooden caissons that were carried bottom-up, with the foundations of the tower on their backs, down to the hard rock, 78 feet below the surface of the water; and those cables do not drag down the corpulent towers with their ponderous cords, but rather, from the apt distribution of their strands and from the resistance—scarcely calculable—that comes to them from their moorings, they bear up the hanging structure, and whatever the traffic of centuries, with its feverish breath, may cast upon it."}, {"e": 5, "t": "And what root could have made fast to earth that giant framework, the amazement of the eyes and the mockery of the air? What needle could have sewn in orderly fashion those steel threads, 15¼ inches in diameter, and knotted them at the ends? Who strung, from tower to tower, over 1,596 feet of width, the first thread—5,000 threads—14,000 miles of thread? Who drew the water out of its dominions, and rode upon the air, and gave man wings?"}, {"e": 5, "t": "Let the readers of *La América* lift their eyes to the great anchoring structures that crown the bridge on one side and the other. They are walls that would bar the passage of the Nile, of hard white stone, which rise 90 feet above high tide: they are walls almost cubic, which measure 119 feet across the front and 132 at the side, and with their enormous weight they bear down upon these that we shall now see—four chains that hold fast, with 36 claws each, the four cables. There in the depths, on the farther side away from the river, there lie, finished off with slender teeth—like the body of an octopus with its many arms, or like stars with rays of curving point—four plates of 46,000 pounds of weight each, which have a surface of 16½ feet by 17½, and gather their slender rays into the compact mass of the"}, {"e": 5, "t": "center, 2½ feet thick, where, through eighteen oblong holes set in two parallel rows of nine, there pass eighteen links; through whose broad eyes of finish, which remain in a double row beneath the plate, there pass most powerful bars, 7 feet long, driven into two semicylindrical grooves cut in the base of the plate. Such, on each side, are the teeth of the bridge. Around the first 18 links, which were left standing like lances of 12½ feet, finished off in an eye instead of a shaft, awaiting soldiers not yet born, they heaped up the blocks of granite, which seemed pieces of a mountain; and as they fastened the links by means of pins that passed at once through all 36 eyes of finish of each 18 contiguous links—braided as the fingers of the hands are braided, and which, left loose, would have turned one upon"}, {"e": 5, "t": "another, as the two leaves of a hinge turn upon their common axis—they tilted toward the river, in the inner curve of the cutlass, with the placing of the invincible stones, each double row of new links, until, as they drew near the height at which the four cables were to come to interlace with the complicated fourfold skeleton, the double row doubles, the two beds of links are turned into four; the 18 bars are now 36; the two parallel pins, which at diverse and equal intervals—like the rings of a flat serpent that crawls—had come securing the double chain, become four; and each of these pins, great enough to be the mast of a ship or the column of a church, holds fast at once, passing through eighteen eyes, the nine in which end the links of each of the four rows, and nine eyes of nine of the strands of each"}, {"e": 5, "t": "cable, which has nineteen strands, each of which splits in two at each end to fit—like a wedge between the two portions of the body it breaks—between the eyes of two contiguous links; whereby, by the same four parallel pins, there are joined in four superposed and identical beds the 36 ends of each anchoring chain and the 36 ends of each cable. Those four double marrows of iron, up to 25 feet below the top of the wall that faces the river—at which point the cable already enters the wall—pass through those two monstrous bodies of granite: marrows that an intricate framework of steel sinews then finishes off; for it is a law, which proclaims the One on high, and the eternal in the analogous, that every organism man invents, to subdue or make fruitful the earth, should be arranged in the likeness of man. It is"}, {"e": 5, "t": "Of wood is—of wood, of Georgia pine, which beneath the water neither the oxygen reaches nor the borer gnaws—the support of both towers. *Caisson* they call it in French and in English, and it is a French invention. It is an immense box, turned inside out: the mouth below; the bottom above; and upon the bottom that serves it as a lid, twenty-two feet of pine planks, crossed at right angles, fastened to the roof of the box by screws thick as trees, and twisted and enlarged, as a madman must see his ideas in his kindled brain; and from timber to timber, iron clamps; and in the joints, tar and adhesive, durable matter. Oh, these things that amaze well deserve that we go down the iron-lined shaft—airtight—that descends from the top of the caisson, between the walls of pine, to the hollow caisson, also of iron"}, {"e": 5, "t": "against air, lined with boiler iron, and whose walls, shod with iron, go on diminishing within, so as to leave greater space for the excavators, from the eight feet with which they begin near the bottom that serves as a roof, to eight inches. Already the corpulent structure floats, with its margin of 11 feet, between the triple palisade that the engineers have built for it in the very place where the tower is to rise; already it begins to sink, under the weight of the first blocks of granite they cast upon its back; already it descends! already it descends! Through the air channels they introduce into the caisson the compressed air, before which the vanquished water flees—not without great struggles, titanic leaps five hundred feet above the shafts, thundering roars, and deadly rebellions. The men who work"}, {"e": 5, "t": "in that deep cannot even whistle, where the air is compressed to 32 pounds per square inch; nor can they put out a light, which rekindles of itself. From the iron shaft by which the excavators descend to the damp hollow of the caisson—divided, for better support, by six partitions where the excavators labor—the men pass, grave and silent at their entrance, cold, anxious, white, and lugubrious as ghosts at their exit, through a kind of antechamber, or air-lock, with two doors, one to the upper shaft, the other to the cave, which never open at once, lest the compressed air escape: only the cave's door opens to give entry to the brave army when that of the shaft has already closed behind them, or the shaft's door, to give them exit, when they have already left the cave's door shut. Behold how, through four"}, {"e": 5, "t": "great openings, there descend to the bottom of the excavation the clanging dredges, with their concave jaws, to seek at the bottom of the shafts—dug to a depth greater than the water level, for which reason the water rises in them to its level—the mud, the sand, the pieces of rock, which in ceaseless shovelfuls the excavators cast into the shafts, so that afterward, as the famished dredge locks its open jaws into the deep opening with a rattle of chains, it may swallow them, suddenly closing its powerful jaws, and draw them up—caisson and tower upward—into the open air, and empty them into the cleaning barges! Behold how, as those heroic, feverish laborers—in whose swollen brains the rushing blood gathers—clean the base, they alternately remove the palisades they had placed a little before beneath the"}, {"e": 5, "t": "partitions of the strange fabric, and, with this system of steps, let fall upon the palisades that remain the tower, which, without the support of those they take away, bears down more heavily upon the rest, and sinks—and replace upon the newly cleaned ground those they removed, so as at once to take away those they had left before, on separating which the tower sinks once more upon the new ones. Behold how, the water expelled and the rock now laid bare, the men cast between it and the top of the caisson 8,000 tons of hydraulic cement—a mass which man, jealous of the nature that created hard crags, has invented. Thus, always at water level, upon the caisson that with its entrails of men went sinking, they built the tower that with its burden of granite went rising. And then, with powerful cranes, they raised"}, {"e": 5, "t": "to 300 feet the stones, great as houses, that crown the tower. And the masons set in place, at that height—as children set their wooden blocks in a toy Crandall tower—stones at whose slightest shock, like butterfly wings at a human blow, the bodies of the workers were dashed to pieces, or their skulls laid open. Oh, unknown workers, oh beautiful martyrs, entrails of greatness, foundation of the eternal fabric, worms of glory!"}, {"e": 5, "t": "And the cables, the sated boas? What spider wove this web from bank to bank over the void? What messenger carried 20,000 times, from the pins of the Brooklyn anchorage, the 19 skeins of which each wire is made, and the 278 strands of which each skein is made, to the pins of the New York anchorage? One morning, like a gallant courting his lady, a steamship circled at the foot of the Brooklyn tower: up it goes, slowly hoisted, the first cord! They mount it upon the tower; they fasten it to the anchoring structure; the steamship drags it to the foot of the New York tower; they hoist the other end; they pass it over the other tower; they fix it to the other anchorage; in the same way they pass a second cord; they join, in each anchorage, around pulleys moved by steam, the ends of both cords—and now the glorious"}, {"e": 5, "t": "\"traveling cord\" is left in perpetual circular motion. Seated in a swing hung from a pulley fixed to the cord that the steam engine sets in motion, the first to cross—amid the booming of cannon, the whistling of locomotives, the waving of flags, and the hurrahs of hundreds of thousands of men—is fearless Farrington, chief of the mechanics. Then they mount upon the traveling cord, raised in arms of iron, a grooved wooden wheel, in which they fit the wire—well soaked in linseed oil to prevent rust, and afterward well dried—which, on eight great wheels, two at the foot of each cable, they have wound, for an extent of two miles, equal to 52 coils around each wheel: there goes the pulley, toiling ant, from one end of the bridge to the other, with its double thread of wire! It arrives, they caress it, they unfit"}, {"e": 5, "t": "the thread and refit it around a great iron horseshoe of fluted edge—the provisional mold from which they later draw the cable to set it into the last pin of the chain: back goes the pulley, empty, creaking and clattering, to the other end: they adjust—with very great labor, from the anchorages and the tops of the towers—the diverse length that each thread must have, since each lies at a diverse height within the skein: there goes the pulley again; the round needle that has sewn the cable! there it goes 139 times, in which it leaves 278 threads! And now the skein is made, which they sheathe in wire, like the eighteen more they make, all at one time, for each of the four cables: and now made, they clamp them with great bands; they tighten still further the nineteen skeins, in which the threads lie one beside"}, {"e": 5, "t": "another, not braided; they gird the cable with half-cylinders, well pressed together; and upon a kind of moving raft that hangs from the cable itself there go—weavers of the air—the sheathers, wrapping the circular mass with wire, which a simple machine, like a steering wheel, carrying the wire wound upon a spool, lets out in a spiral: and now, the boa well dressed, they lay it upon its grooved plate which, upon sliding wheels—so that the cable may stretch and shrink, and not harm the fabric with its weight—awaits it on the summit of the tower."}, {"e": 5, "t": "From the cables hang, held by iron bands, the braided stays, 208 on each cable: from the stays, the horizontal plates that sustain the pavement, and the six vertical walls of diverse heights that cross them, and steel laths from wall to wall, and diagonal laths, upon whose framework there spread, in a thick tongue 3,178 feet long and 85 wide, the five roadways—19 feet wide the carriage ones; the railway ones, 15½—and, giving a view of islands like baskets, of cities like furnaces, of steamships that seem, for how alert, noisy, and skillful they are, talking messengers, and white ants that jostle one another on the river, cross their antennae, communicate their message, and part—giving a view of rivers like seas, there rises in the center, like a crest 16 feet wide, the path of the people on foot who, since"}, {"e": 5, "t": "the bridge opened its doors, cross it—at times pressing together in enormous masses, to give exit to which one must raise the railings of the path—two formidable and never-thinning files of pedestrians."}, {"e": 5, "t": "Nor is there fear that the structure will come down, for even were the 278 [strands] that sustain it from each cable to break all at once, there would suffice to hold it aloft, with its own weight and that of the traffic, the branching of auxiliary stays which, like a tremendous open hand of slender wrist, comes down almost to the middle of the cable on each side, from the top of each tower. There is no fear that the structure will move, nor that it will be shaken by the play of the winds or the wraths of the storm; because at its base the towers bite it with teeth of steel, and so that the greatest wind may not disturb it, the two outer cables curve inward as they reach the middle of the bridge, and the two inner ones bend toward the outer ones, whereby the resistance is made greater. The mischievous winds"}, {"e": 5, "t": "will not, no, come to overturn carts into the river, because the edges of the bridge rise 8 feet high, and between the carriage roadways and those of the railway there is strung, to restrain the thrusts of the wind, a net of strong wires. Nor is there risk that the cables will give way—for there will never come upon each of them a weight greater than 3,000 tons, and it is made to sustain, with its 294 arms, twelve thousand. Nor will the bridge twist, splinter, or spring apart when the heat of summer dilates it—as the spirit dilates in the sun of love—or the rigor of winter shortens it; because this fivefold roadway is, as it were, split into two halves, to prevent the expansion and the contraction, by means of an extension plate at the midpoint of the way, which plate, fixed to the end of one of the"}, {"e": 5, "t": "portions, joins upon movable couplings with the end of the second portion. And when, at the foot of one of the towers, there pile up in a blockade with no way out thousands of women who sob, children who cry, policemen who shout, struggling to open a path, there move seigniorially, like giants who bow in greeting, a mere hair's breadth, the cables in their sliding beds atop the towers. Thus have they built, and thus it remains, less beautiful than great, and like the powerful arm of the human mind, the mighty structure. No longer are deep moats dug around battlemented fortresses; rather, with arms of steel, cities embrace one another; no longer do sentry boxes of soldiers guard the towns, but booths of clerks with neither lance nor rifle, who collect the penny of peace from the labor that passes by: bridges"}, {"e": 5, "t": "are the fortresses of the modern world. Better than to open breasts is to join cities: this is what all men are now called to be—soldiers of the bridge!"}, {"e": 6, "t": "New York, May 1884 \"But how would you establish that system of itinerant teachers which we have never seen mentioned in any book on education, and which you recommend in one of the issues of La América from last year that I have before me?\" —So an enthusiastic gentleman from Santo Domingo is good enough to ask us. We will tell him, in brief, that what matters is the thing itself, and not the form in which it is done. There is a cluster of essential truths that could fit within the wing of a hummingbird, and yet they are the key to public peace, to spiritual elevation, and to the greatness of nations. Men must be kept in knowledge of the earth and of the permanence and transcendence of life."}, {"e": 6, "t": "Men must live in the peaceful, natural, and inevitable enjoyment of Liberty, as they live in the enjoyment of air and of light. A people is condemned to die in which the love of wealth and the knowledge of the sweetness, the necessity, and the pleasures of life do not develop in equal measure. Men need to know the composition, the fertilization, the transformations, and the applications of the material elements, from whose working comes the wholesome pride of one who labors directly in nature, the vigor of body that results from contact with the forces of the earth, and the honest and secure fortune that its cultivation produces."}, {"e": 6, "t": "Men need someone who often stirs compassion in their breast, and tears in their eyes, and does them the supreme good of making them feel generous; for by a marvelous compensation of nature, he who gives himself grows; while he who withdraws into himself, and lives on small pleasures, and fears to share them with others, and thinks only, avariciously, of serving his own appetites, is gradually transformed from a man into a solitude, and carries in his breast all the white hairs of winter, and comes to be within, and to appear without—an insect. Men grow, grow physically, grow in a visible way, when they learn something, when they come to possess something, and when they have done some good."}, {"e": 6, "t": "Only fools speak of misfortunes, or the selfish. Happiness exists upon the earth; and it is won through the prudent exercise of reason, the knowledge of the harmony of the universe, and the constant practice of generosity. He who seeks it elsewhere will not find it: for after having tasted every cup of life, flavor is found only in these. —It is a legend in the lands of Spanish America that at the bottom of the old cups a Christ was painted, which is why, when someone drains one, they say: \"Until I see you, my Christ!\" Well, at the bottom of those cups there opens a serene, fragrant, endless sky, overflowing with tenderness! To be good is the only way to be happy. To be cultured is the only way to be free. But, in the common run of human nature, one must be prosperous in order to be good."}, {"e": 6, "t": "And the only road open to constant and easy prosperity is that of knowing, cultivating, and making use of the inexhaustible and tireless elements of nature. Nature has no jealousies, as men have. It has no hatreds, nor fear, as men have. It bars the way to no one, because it fears no one. Men will always have need of the products of nature. And since in each region only certain products are given, their active exchange will always be maintained, which assures all peoples comfort and wealth."}, {"e": 6, "t": "There is no need, then, to undertake now a crusade to reconquer the Holy Sepulcher. Jesus did not die in Palestine, but rather is alive in every man. The greater part of mankind has passed asleep over the earth. They ate and drank; but they knew nothing of themselves. The crusade must be undertaken now to reveal to men their own nature, and to give them, with the knowledge of plain and practical science, the personal independence that strengthens goodness and fosters the decorum and the pride of being a loving creature and a living thing in the great universe. Here, then, is what the teachers must carry through the countryside. Not only agricultural explanations and mechanical instruments; but tenderness, which men so greatly need and which does them so much good."}, {"e": 6, "t": "The peasant cannot leave his work to go miles down the road to see incomprehensible geometric figures, and to learn the capes and rivers of the peninsulas of Africa, and to stock himself with empty didactic terms. The peasants' children cannot withdraw whole leagues, day after day, from their father's homestead to go and learn Latin declensions and abbreviated division. And the peasants, nevertheless, are the best mass of the nation, and the most healthy and vigorous, because they receive, closely and fully, the emanations and the kindly correspondence of the earth, in whose company they live. The cities are the mind of nations; but their heart, where the blood gathers and from which it is distributed, lies in the countryside. Men are still eating machines, and reliquaries of prejudices. It is necessary to"}, {"e": 6, "t": "Why, nothing less do we propose than the new religion and the new priests! Nothing less do we go depicting than the missions with which the new age will soon begin to spread its religion! The world is in a state of change; and the purples and the chasubles, necessary in the mystical times of man, lie stretched upon the bed of agony. Religion has not disappeared, but rather has been transformed. Above the dismay into which the study of the details and the slow unfolding of human history plunges observers, one sees that men grow, and that they have already climbed half of Jacob's ladder: what beautiful poetry the Bible holds! If, crouched upon a summit, one suddenly casts one's eyes over the march of humanity, one will see that never did peoples love one another as much as they love one another now, and that"}, {"e": 6, "t": "in spite of the painful disorder and the abominable selfishness into which the momentary absence of final beliefs and faith in the truth of the Eternal brings the inhabitants of this transitory age, never were human beings as preoccupied as they are today with the benevolence and the impulse of expansion that now sets all men ablaze. They have risen to their feet, like friends who knew of one another, and longed to become acquainted; and they all march together toward a happy encounter. We walk upon the waves, and we rebound and roll with them; and so we do not see, nor, stunned by the blow, do we pause to examine, the forces that move them. But when this sea grows calm, it may be affirmed that the stars will remain nearer to the earth. Man will at last sheathe in the sun his sword of battle!"}, {"e": 6, "t": "What has been said is what we would set as the soul of the itinerant teachers. What joy there would be among the peasants, when they saw arriving, from time to time, the good man who teaches them what they do not know, and who, with the effusions of an expansive manner, leaves in their spirit the calm and elevation that always remain from seeing a loving and healthy man! Instead of livestock and harvests, they would speak now and then—until at last they would be speaking always—of what the teacher taught, of the curious machine he brought, of the simple way to cultivate the plant they had been working with such labor, of how great and good the teacher is, and of when he will come, for they are already in a hurry to ask him about what, with that ceaseless enlargement of the mind once set to thinking, has been"}, {"e": 6, "t": "occurring to them ever since they began to know something! With what joy they would all go to take shelter, leaving behind their spades and hoes, in the teacher's field tent, full of curiosities! Long courses, it is clear, could not be given; but the germinal ideas could indeed, if well studied by the propagators, be scattered and infused. The appetite for knowledge could be awakened. The impetus could be given."}, {"e": 6, "t": "And this would be a gentle invasion, made in accordance with what is base and self-interested in the human soul; because, since the teacher would be teaching them, in a mild manner, practical and profitable things, there would be instilled in them of their own pleasure, without effort, a knowledge that begins by flattering and serving their interest;—for whoever intends to better man must not disregard his evil passions, but rather count them as a most important factor, and contrive not to act against them, but with them."}, {"e": 6, "t": "We would not send pedagogues through the countryside, but conversers. We would not send schoolmasters, but educated people who would go about answering the doubts the ignorant presented to them, or the questions they had prepared for when the teachers came, and observing where errors of cultivation were being committed or exploitable riches went unrecognized, so as to reveal the latter and demonstrate the former, with the remedy at the foot of the demonstration. In sum, there is a need to open a campaign of tenderness and of science, and to create for it a body—which does not exist—of missionary teachers. The itinerant school is the only one that can remedy the ignorance of the countryside."}, {"e": 6, "t": "And in the countryside as in the cities, there is an urgent need to replace the indirect and sterile knowledge of books with the direct and fruitful knowledge of nature. There is an urgent need to open normal schools of practical teachers, so as to scatter them afterward through valleys, mountains, and corners, as the Indians of the Amazon tell that Father Amalivaca, in order to create men and women, scattered over all the earth the seeds of the moriche palm! Time is wasted in elementary literary instruction, and peoples of pernicious and empty aspirants are created. The sun is no more necessary than the establishment of elementary scientific instruction. La América, New York, May 1884."}, {"e": 7, "t": "My dearest brother: At last I can write; at last I can tell you with what tenderness and gratitude and respect I love you, and that household which is mine, and my pride and my duty. Every day now I am in danger of giving my life for my country and for my duty—for I understand that duty and have the spirit to carry it out—the duty of preventing in time, through the independence of Cuba, the United States from spreading across the Antilles and falling, with that added force, upon our lands of America. All that I have done until today, and all that I shall do, is for this. It has had to be done in silence, and as it were indirectly, because there are things that, to be achieved, must go hidden, and that, if proclaimed for what they are, would raise difficulties too formidable to attain the end over them."}, {"e": 7, "t": "The very lesser and public obligations of nations—such as yours and mine—which are most vitally concerned in preventing the opening in Cuba, through the annexation of the imperialists over there and of the Spaniards, of the road which is to be blocked, and which we are blocking with our blood, of the annexation of the peoples of our America to the turbulent and brutal North that despises them—would have kept them from the open adherence and manifest aid to this sacrifice, which is made for their immediate benefit. I have lived inside the monster, and I know its entrails;—and my sling is the sling of David."}, {"e": 7, "t": "At this very moment, a few days ago, in the flush of the victory with which the Cubans greeted our free emergence from the mountains where the six men of the expedition had wandered for fourteen days, the correspondent of the Herald, who pulled me from my hammock in my hut, speaks to me of the annexationist activity—less to be feared for the slight reality of its aspirants, of the pettifogging sort, without backbone or creativity, who, as a comfortable disguise for their complaisance or their submission to Spain, beg of her, without faith, the autonomy of Cuba, content only that there be a master, Yankee or Spanish, to sustain them, or to create for them, in reward for their office of go-betweens, the standing of leading men, disdainful of the vigorous mass—the mestizo mass, skillful and moving, of the"}, {"e": 7, "t": "And the Herald correspondent, Eugenio Bryson, tells me more:—of a Yankee syndicate—which shall not be—with a lien upon the Customs, too deeply pledged to the rapacious Spanish banks for any handhold to remain for those of the North—fortunately incapacitated, by its hampered and complex political constitution, from undertaking or supporting the idea as a work of the government. And Bryson told me yet more—though the certainty of the conversation he reported to me can only be grasped by one who knows at close hand the vigor with which we have raised the revolution, the disorder, the listlessness and the bad pay of the novice Spanish army, and the incapacity of Spain to gather, in Cuba or abroad, the resources against the war which the previous time she drew from Cuba alone:—Bryson recounted his conversation"}, {"e": 7, "t": "with Martínez Campos, at the end of which the latter gave him to understand that, without doubt, when the hour came, Spain would rather come to terms with the United States than surrender the Island to the Cubans. And Bryson told me still more: of a man known to us, and of how much he is cultivated in the North as the candidate of the United States, for when the present president shall disappear, for the presidency of Mexico."}, {"e": 7, "t": "Hereabouts, I do my duty. The war of Cuba, a reality superior to the vague and scattered desires of the Cuban and Spanish annexationists to whom only their alliance with the government of Spain would give any relative power, has come in its hour in America, to prevent—even against the frank employment of all those forces—the annexation of Cuba to the United States, which will never accept it from a country at war, nor can contract, since the war will not accept annexation, the odious and absurd commitment of putting down on their own account and with their own arms a war of American independence.—And Mexico—will it not find a shrewd, effective and immediate way of aiding, in time, him who defends it? Yes, it will find one—or I shall find it for her. This is a matter of death or life, and there is no room for"}, {"e": 7, "t": "error. The discreet way is the only thing that remains to be seen. I would already have found and proposed it. But I must have more authority in myself, or know who holds it, before acting or advising. I have only just arrived. The constitution of our government, useful and simple, may yet take two months, if it is to be real and stable. Our soul is one, and I know it, and the will of the country; but these things are always the work of relation, of the moment, and of accommodations. With the representation that I hold, I do not wish to do anything that may seem a capricious extension of it."}, {"e": 7, "t": "I arrived, with General Máximo Gómez and four others, in a boat, in which I took the bow oar under the storm, to an unknown rocky stretch of our shores; for fourteen days I carried on foot, over thorns and heights, my knapsack and my rifle;—we roused people as we passed; I feel, in the benevolence of souls, the root of this love of mine for the sorrow of man and for the justice of relieving it; the fields are ours without dispute, to such a degree that in one month I have been able to hear gunfire only once; and at the gates of the cities we either win a victory, or review, amid an enthusiasm like religious fire, three thousand armed men;—we continue our march to the center of the Island, so that I may lay down, before the revolution I have raised up, the authority the emigration gave me, which was heeded"}, {"e": 7, "t": "within, and which must be renewed, in keeping with its new condition, by an assembly of delegates of the visible Cuban people, of the revolutionaries in arms. The revolution desires full liberty in the army, without the shackles formerly set against it by a Chamber without real sanction, or by the suspicion of a youth jealous of its republicanism, or by the jealousy, and the fears of excessive future prominence, of a scrupulous or far-seeing chieftain; but the revolution wishes at the same time a succinct and respectable republican representation—the same soul of humanity and decorum, filled with the longing for individual dignity, in the representation of the republic, as the one that drives and sustains the revolutionaries in the war."}, {"e": 7, "t": "For my part, I understand that a people cannot be led against the soul that moves it, or without that soul, and I know how hearts are kindled, and how the fiery and contented state of hearts may be turned to account for the ceaseless stirring and the onset. But as to forms, many ideas have their place: and the affairs of men are made with the men who make them. You know me. In myself, I will defend only what I hold to be a guarantee or a service of the revolution. I know how to disappear. But my thought would not disappear, nor would my obscurity embitter me.—And as soon as we have form, we shall act, whether this falls to me, or to others."}, {"e": 7, "t": "And now, having set before you what is of public interest, I will speak to you of myself, since only the emotion of this duty could raise from the longed-for death the man who—now that Nájera no longer lives where he may be seen—best knows you, and cherishes as a treasure in his heart the friendship with which you honor him. I know your scoldings, held in silence, after my journey. And how much of ourselves we gave, with all our soul, and he silent! What a deception this is, and what a hardened soul is his, that the tribute and the honor of our affection has not been able to make him write one more letter upon the letter-paper and the newspaper that he fills day by day![…] There are effects of so delicate an honesty."}]</script>
<script type="module">
let pipeline, env;
const ESSAYS=JSON.parse(document.getElementById('essays').textContent);
const PASS=JSON.parse(document.getElementById('passages').textContent);
const DIM=384, MODEL='Xenova/all-MiniLM-L6-v2', CK='jm_v1_'+PASS.length;
const q=document.getElementById('q'),go=document.getElementById('go'),f=document.getElementById('f'),r=document.getElementById('r'),statusEl=document.getElementById('status'),tg=document.getElementById('tg');
let MODE='p', extractor=null, P=null, E=null, pending=null;
function setStatus(m){statusEl.textContent=m||'';}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function norm(v){let s=0;for(let i=0;i<v.length;i++)s+=v[i]*v[i];s=Math.sqrt(s)||1;for(let i=0;i<v.length;i++)v[i]/=s;return v;}

tg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;MODE=b.dataset.m;[...tg.children].forEach(x=>x.classList.toggle('on',x===b));if(q.value.trim())run();});

// reader
const RD=document.getElementById('reader');
function openReader(ei){const e=ESSAYS[ei];document.getElementById('rt').textContent=e.t;document.getElementById('rb').textContent=e.b||'';document.getElementById('rx').innerHTML=e.x.split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('');RD.scrollTop=0;RD.style.display='block';}
document.getElementById('rback').onclick=()=>{RD.style.display='none';};

async function embed(texts){const o=await extractor(texts,{pooling:'mean',normalize:true});return o.tolist();}
function idbGet(k){return new Promise(res=>{try{const o=indexedDB.open('jmdb',1);o.onupgradeneeded=()=>o.result.createObjectStore('kv');o.onsuccess=()=>{const g=o.result.transaction('kv').objectStore('kv').get(k);g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null);};o.onerror=()=>res(null);}catch(e){res(null);}});}
function idbSet(k,v){return new Promise(res=>{try{const o=indexedDB.open('jmdb',1);o.onupgradeneeded=()=>o.result.createObjectStore('kv');o.onsuccess=()=>{const t=o.result.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(1);t.onerror=()=>res(0);};o.onerror=()=>res(0);}catch(e){res(0);}});}

function essayVectors(){E=new Float32Array(ESSAYS.length*DIM);const cnt=new Int32Array(ESSAYS.length);for(let i=0;i<PASS.length;i++){const e=PASS[i].e,off=e*DIM,po=i*DIM;for(let d=0;d<DIM;d++)E[off+d]+=P[po+d];cnt[e]++;}for(let e=0;e<ESSAYS.length;e++){const off=e*DIM;const v=E.subarray(off,off+DIM);norm(v);}}

async function init(){
  try{({pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2'));env.allowLocalModels=false;env.useBrowserCache=true;}
  catch(e){setStatus('⚠ No internet — the search model could not load. Reconnect and reload.');return;}
  try{extractor=await pipeline('feature-extraction',MODEL,{progress_callback:d=>{if(d.status==='progress'&&d.progress!=null)setStatus('Loading model… '+d.progress.toFixed(0)+'%');}});}
  catch(e){setStatus('⚠ Could not download the model. Reload.');return;}
  const cached=await idbGet(CK);
  if(cached&&cached.byteLength===PASS.length*DIM*4){P=new Float32Array(cached);setStatus('');}
  else{setStatus('Indexing (first time)…');P=new Float32Array(PASS.length*DIM);const B=32;for(let i=0;i<PASS.length;i+=B){const vs=await embed(PASS.slice(i,i+B).map(p=>p.t));for(let j=0;j<vs.length;j++)P.set(vs[j],(i+j)*DIM);setStatus('Indexing… '+Math.min(i+B,PASS.length)+'/'+PASS.length);}idbSet(CK,P.buffer.slice(0));setStatus('');}
  essayVectors(); q.focus(); if(pending){const p=pending;pending=null;q.value=p;run();}
}
function topk(mat,n,qv,k){const sc=new Float32Array(n);for(let i=0;i<n;i++){let s=0;const o=i*DIM;for(let d=0;d<DIM;d++)s+=mat[o+d]*qv[d];sc[i]=s;}const idx=[...sc.keys()].sort((a,b)=>sc[b]-sc[a]).slice(0,k);return idx.map(i=>[i,sc[i]]);}
async function run(){
  const query=q.value.trim(); if(!query)return;
  if(!P){pending=query;setStatus(extractor?'Indexing… your search will run when ready.':'Loading model… your search will run when ready.');return;}
  go.disabled=true;setStatus('Searching…');
  const qv=norm((await embed([query]))[0]);
  let html='';
  if(MODE==='p'){
    const hits=topk(P,PASS.length,qv,8);
    html=hits.map(([i,s])=>{const p=PASS[i],e=ESSAYS[p.e];return `<div class="card" data-e="${p.e}"><div class="quote">&ldquo;${esc(p.t)}&rdquo;</div><div class="meta"><span>${esc(e.t)}</span><span class="score">${s.toFixed(3)}</span></div></div>`;}).join('');
  }else{
    const hits=topk(E,ESSAYS.length,qv,6);
    html=hits.map(([i,s])=>{const e=ESSAYS[i];const snip=e.x.replace(/\s+/g,' ').slice(0,180);return `<div class="card" data-e="${i}"><div class="etitle">${esc(e.t)}</div><div class="snip">${esc(snip)}…</div><div class="meta"><span>${esc(e.b||'')}</span><span class="score">${s.toFixed(3)}</span></div></div>`;}).join('');
  }
  r.innerHTML=html;
  document.body.classList.add('has-results');document.documentElement.classList.add('has-results');
  setStatus('');go.disabled=false;
}
r.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openReader(+c.dataset.e);});
q.addEventListener('input',()=>{if(!q.value.trim()){r.innerHTML='';document.body.classList.remove('has-results');document.documentElement.classList.remove('has-results');}});
f.onsubmit=e=>{e.preventDefault();run();};
(function(){const s=document.getElementById('splash');setTimeout(()=>{s.classList.add('hide');setTimeout(()=>s.remove(),800);},5000);})();
init();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body></html>
